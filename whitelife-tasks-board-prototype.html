<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>WhiteLife — доска задач</title>
  <style>
    :root {
      --wl-bg: #ffffff;
      --wl-surface: #ffffff;
      --wl-surface-soft: #f7f8fa;
      --wl-surface-hover: #f1f3f5;
      --wl-border: #e3e7eb;
      --wl-border-strong: #cdd4db;
      --wl-text: #1b232c;
      --wl-text-secondary: #59636e;
      --wl-text-muted: #8a949f;
      --wl-primary: #2463eb;
      --wl-primary-hover: #1e54cc;
      --wl-primary-soft: #eaf1ff;
      --wl-primary-border: #cddcff;
      --wl-success: #168360;
      --wl-success-soft: #e7f6f0;
      --wl-warning: #b5650b;
      --wl-warning-soft: #fff4df;
      --wl-danger: #c83b48;
      --wl-danger-soft: #fff0f2;
      --wl-purple: #7557d9;
      --wl-purple-soft: #f1edff;
      --wl-cyan: #0b8093;
      --wl-cyan-soft: #e5f7fa;
      --wl-sidebar-width: 232px;
      --wl-header-height: 64px;
      --wl-board-column: 272px;
      --wl-board-visible-columns: 5;
      --wl-board-min-width: 1408px;
      --wl-radius-xs: 6px;
      --wl-radius-sm: 8px;
      --wl-radius-md: 12px;
      --wl-radius-lg: 16px;
      --wl-shadow-sm: 0 1px 2px rgba(20, 30, 42, 0.05);
      --wl-shadow-md: 0 16px 42px rgba(20, 30, 42, 0.14);
      --wl-font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--wl-text);
      background: var(--wl-bg);
      font-family: var(--wl-font);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      color: inherit;
      font: inherit;
    }

    button {
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--wl-primary);
      outline-offset: 2px;
    }

    .wl-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .wl-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .wl-icon--sm {
      width: 15px;
      height: 15px;
    }

    .wl-app {
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--wl-sidebar-width) minmax(0, 1fr);
    }

    .wl-sidebar {
      position: relative;
      z-index: 40;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--wl-border);
      background: var(--wl-surface);
    }

    .wl-brand {
      height: var(--wl-header-height);
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid var(--wl-border);
    }

    .wl-brand__mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 9px;
      color: #fff;
      background: var(--wl-primary);
    }

    .wl-brand__name {
      font-size: 15px;
      font-weight: 730;
      letter-spacing: -0.02em;
    }

    .wl-brand__env {
      margin-left: auto;
      padding: 2px 6px;
      border: 1px solid var(--wl-border);
      border-radius: 5px;
      color: var(--wl-text-muted);
      background: var(--wl-surface-soft);
      font-size: 9px;
      font-weight: 720;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .wl-nav {
      padding: 18px 12px;
      display: grid;
      gap: 3px;
    }

    .wl-nav__label {
      padding: 0 10px 8px;
      color: var(--wl-text-muted);
      font-size: 10px;
      font-weight: 710;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .wl-nav__item {
      width: 100%;
      height: 42px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: var(--wl-radius-sm);
      color: var(--wl-text-secondary);
      text-align: left;
      transition: color 120ms ease, background 120ms ease;
    }

    .wl-nav__item:hover {
      color: var(--wl-text);
      background: var(--wl-surface-hover);
    }

    .wl-nav__item[aria-current="page"] {
      color: var(--wl-primary);
      background: var(--wl-primary-soft);
    }

    .wl-nav__text {
      flex: 1;
      font-weight: 570;
    }

    .wl-nav__badge {
      min-width: 22px;
      height: 20px;
      padding: 0 6px;
      display: inline-grid;
      place-items: center;
      border-radius: 10px;
      color: var(--wl-text-secondary);
      background: var(--wl-surface-hover);
      font-size: 11px;
      font-weight: 680;
    }

    .wl-sidebar__footer {
      margin-top: auto;
      padding: 14px 12px;
      border-top: 1px solid var(--wl-border);
    }

    .wl-profile {
      width: 100%;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: var(--wl-radius-sm);
      text-align: left;
    }

    .wl-profile:hover {
      background: var(--wl-surface-hover);
    }

    .wl-avatar {
      width: 30px;
      height: 30px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: #fff;
      background: var(--wl-avatar-color, #607286);
      font-size: 10px;
      font-weight: 720;
    }

    .wl-profile__copy {
      min-width: 0;
      flex: 1;
      display: grid;
    }

    .wl-profile__name {
      overflow: hidden;
      font-size: 12.5px;
      font-weight: 630;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wl-profile__role {
      color: var(--wl-text-muted);
      font-size: 11px;
    }

    .wl-main {
      min-width: 0;
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: var(--wl-header-height) minmax(0, 1fr);
    }

    .wl-topbar {
      position: relative;
      z-index: 30;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--wl-border);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
    }

    .wl-mobile-menu {
      display: none;
    }

    .wl-workspace {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wl-workspace__dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--wl-primary);
      box-shadow: 0 0 0 4px var(--wl-primary-soft);
    }

    .wl-workspace__name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wl-global-search {
      width: min(430px, 42vw);
      height: 36px;
      margin-left: auto;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--wl-border);
      border-radius: var(--wl-radius-sm);
      color: var(--wl-text-muted);
      background: var(--wl-surface-soft);
      text-align: left;
    }

    .wl-global-search span {
      overflow: hidden;
      font-size: 12.5px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wl-key {
      margin-left: auto;
      padding: 1px 6px;
      border: 1px solid var(--wl-border-strong);
      border-bottom-width: 2px;
      border-radius: 5px;
      color: var(--wl-text-muted);
      background: #fff;
      font-size: 10px;
      font-weight: 650;
    }

    .wl-icon-button {
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid transparent;
      border-radius: var(--wl-radius-sm);
      color: var(--wl-text-secondary);
      transition: color 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    .wl-icon-button:hover {
      color: var(--wl-text);
      background: var(--wl-surface-hover);
    }

    .wl-icon-button--bordered {
      border-color: var(--wl-border);
      background: var(--wl-surface);
    }

    .wl-content {
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
    }

    .wl-page {
      width: min(1680px, 100%);
      margin: 0 auto;
      padding: 28px 30px 70px;
    }

    .wl-page-header {
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }

    .wl-page-title {
      margin: 0;
      font-size: clamp(24px, 2vw, 30px);
      font-weight: 740;
      letter-spacing: -0.035em;
      line-height: 1.15;
    }

    .wl-page-subtitle {
      margin: 7px 0 0;
      color: var(--wl-text-secondary);
      font-size: 13px;
    }

    .wl-page-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wl-button {
      min-height: 38px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--wl-border);
      border-radius: var(--wl-radius-sm);
      background: var(--wl-surface);
      font-size: 13px;
      font-weight: 620;
      white-space: nowrap;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    .wl-button:hover {
      border-color: var(--wl-border-strong);
      background: var(--wl-surface-hover);
    }

    .wl-button--primary {
      border-color: var(--wl-primary);
      color: #fff;
      background: var(--wl-primary);
    }

    .wl-button--primary:hover {
      border-color: var(--wl-primary-hover);
      background: var(--wl-primary-hover);
    }

    .wl-summary {
      margin-top: 26px;
      display: flex;
      align-items: center;
      gap: 30px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .wl-summary::-webkit-scrollbar {
      display: none;
    }

    .wl-summary__item {
      min-width: max-content;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .wl-summary__icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--wl-primary);
      background: var(--wl-primary-soft);
    }

    .wl-summary__item--danger .wl-summary__icon {
      color: var(--wl-danger);
      background: var(--wl-danger-soft);
    }

    .wl-summary__item--warning .wl-summary__icon {
      color: var(--wl-warning);
      background: var(--wl-warning-soft);
    }

    .wl-summary__item--success .wl-summary__icon {
      color: var(--wl-success);
      background: var(--wl-success-soft);
    }

    .wl-summary__copy {
      display: grid;
    }

    .wl-summary__value {
      font-size: 17px;
      font-weight: 730;
      line-height: 1.1;
    }

    .wl-summary__label {
      margin-top: 2px;
      color: var(--wl-text-muted);
      font-size: 11.5px;
    }

    .wl-controls {
      position: relative;
      z-index: 12;
      margin-top: 26px;
    }

    .wl-controls__main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .wl-field {
      min-width: 0;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--wl-border);
      border-radius: var(--wl-radius-sm);
      color: var(--wl-text-secondary);
      background: var(--wl-surface);
    }

    .wl-field:hover {
      border-color: var(--wl-border-strong);
    }

    .wl-field--search {
      width: min(310px, 28vw);
      padding: 0 10px;
    }

    .wl-field--search:focus-within {
      border-color: var(--wl-primary);
      box-shadow: 0 0 0 3px var(--wl-primary-soft);
    }

    .wl-field input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 12.5px;
    }

    .wl-field input::placeholder {
      color: var(--wl-text-muted);
    }

    .wl-select-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .wl-select-wrap > .wl-icon {
      position: absolute;
      left: 10px;
      z-index: 1;
      width: 15px;
      height: 15px;
      pointer-events: none;
    }

    .wl-select-wrap::after {
      position: absolute;
      right: 13px;
      width: 6px;
      height: 6px;
      border-right: 1.5px solid var(--wl-text-muted);
      border-bottom: 1.5px solid var(--wl-text-muted);
      content: "";
      pointer-events: none;
      transform: translateY(-2px) rotate(45deg);
    }

    .wl-select {
      height: 38px;
      min-width: 138px;
      padding: 0 39px 0 31px;
      border: 1px solid var(--wl-border);
      border-radius: var(--wl-radius-sm);
      outline: 0;
      appearance: none;
      color: var(--wl-text-secondary);
      background: var(--wl-surface);
      font-size: 12.5px;
      font-weight: 550;
      cursor: pointer;
    }

    .wl-select:hover {
      border-color: var(--wl-border-strong);
    }

    .wl-select:focus {
      border-color: var(--wl-primary);
      box-shadow: 0 0 0 3px var(--wl-primary-soft);
    }

    .wl-controls__spacer {
      flex: 1;
    }

    .wl-segmented {
      padding: 3px;
      display: flex;
      gap: 2px;
      border-radius: var(--wl-radius-sm);
      background: var(--wl-surface-hover);
    }

    .wl-segmented__button {
      height: 30px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 6px;
      color: var(--wl-text-muted);
      font-size: 11.5px;
      font-weight: 630;
      white-space: nowrap;
    }

    .wl-segmented__button:hover {
      color: var(--wl-text);
    }

    .wl-segmented__button[aria-pressed="true"] {
      color: var(--wl-text);
      background: #fff;
      box-shadow: var(--wl-shadow-sm);
    }

    .wl-controls__secondary {
      min-height: 35px;
      padding-top: 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--wl-text-muted);
      font-size: 11.5px;
    }

    .wl-results {
      white-space: nowrap;
    }

    .wl-active-filters {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .wl-filter-chip {
      max-width: 180px;
      height: 26px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid var(--wl-primary-border);
      border-radius: 13px;
      color: var(--wl-primary);
      background: var(--wl-primary-soft);
      font-size: 11px;
      font-weight: 630;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wl-filter-chip .wl-icon {
      width: 12px;
      height: 12px;
    }

    .wl-clear-filters {
      margin-left: auto;
      padding: 4px 6px;
      flex: 0 0 auto;
      border-radius: 5px;
      color: var(--wl-primary);
      font-size: 11.5px;
      font-weight: 620;
    }

    .wl-clear-filters:hover {
      background: var(--wl-primary-soft);
    }

    .wl-view-popover {
      position: absolute;
      z-index: 60;
      top: calc(100% + 8px);
      right: 0;
      width: 276px;
      padding: 8px;
      visibility: hidden;
      border: 1px solid var(--wl-border);
      border-radius: var(--wl-radius-md);
      background: var(--wl-surface);
      box-shadow: var(--wl-shadow-md);
      opacity: 0;
      transform: translateY(-5px);
      transition: opacity 120ms ease, transform 120ms ease, visibility 120ms ease;
    }

    .wl-view-popover--visible {
      visibility: visible;
      opacity: 1;
      transform: none;
    }

    .wl-view-popover__title {
      padding: 6px 8px 8px;
      color: var(--wl-text-muted);
      font-size: 10.5px;
      font-weight: 710;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .wl-view-option {
      width: 100%;
      min-height: 38px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-radius: 7px;
      text-align: left;
      font-size: 12.5px;
    }

    .wl-view-option:hover {
      background: var(--wl-surface-hover);
    }

    .wl-view-option input {
      accent-color: var(--wl-primary);
    }

    .wl-legend {
      margin: 6px 5px 4px;
      padding-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-top: 1px solid var(--wl-border);
      color: var(--wl-text-secondary);
      font-size: 11px;
    }

    .wl-legend__item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wl-mobile-status {
      margin-top: 14px;
      display: none;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .wl-mobile-status::-webkit-scrollbar {
      display: none;
    }

    .wl-mobile-status__button {
      height: 34px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      border: 1px solid var(--wl-border);
      border-radius: 17px;
      color: var(--wl-text-secondary);
      background: var(--wl-surface);
      font-size: 11.5px;
      font-weight: 620;
    }

    .wl-mobile-status__button[aria-pressed="true"] {
      border-color: var(--wl-primary-border);
      color: var(--wl-primary);
      background: var(--wl-primary-soft);
    }

    .wl-status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--wl-status-color, var(--wl-text-muted));
    }

    .wl-board-region {
      margin-top: 16px;
    }

    .wl-board-scroll {
      min-width: 0;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-color: var(--wl-border-strong) transparent;
    }

    .wl-board-canvas {
      min-width: var(--wl-board-min-width);
    }

    .wl-status-head {
      position: sticky;
      top: 0;
      z-index: 8;
      padding: 0 0 8px;
      display: grid;
      grid-template-columns: repeat(var(--wl-board-visible-columns), minmax(var(--wl-board-column), 1fr));
      gap: 12px;
      background: linear-gradient(var(--wl-surface) 82%, rgba(255, 255, 255, 0));
    }

    .wl-status-head__item {
      min-width: 0;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      border-radius: var(--wl-radius-sm);
      color: var(--wl-text-secondary);
      font-size: 11.5px;
      font-weight: 670;
    }

    .wl-status-head__label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wl-status-head__count {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      display: inline-grid;
      place-items: center;
      border-radius: 10px;
      color: var(--wl-text-muted);
      background: var(--wl-surface-hover);
      font-size: 10.5px;
    }

    .wl-wip {
      margin-left: auto;
      color: var(--wl-text-muted);
      font-size: 10px;
      font-weight: 570;
      white-space: nowrap;
    }

    .wl-wip--over {
      color: var(--wl-danger);
      font-weight: 680;
    }

    .wl-lanes {
      display: grid;
      gap: 20px;
    }

    .wl-lane {
      min-width: 0;
    }

    .wl-lane__header {
      min-height: 52px;
      padding: 7px 8px 9px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-top: 1px solid var(--wl-border);
    }

    .wl-lane:first-child .wl-lane__header {
      border-top-color: transparent;
    }

    .wl-lane--flat .wl-lane__header {
      display: none;
    }

    .wl-lane__toggle {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 7px;
      color: var(--wl-text-muted);
    }

    .wl-lane__toggle:hover {
      color: var(--wl-text);
      background: var(--wl-surface-hover);
    }

    .wl-lane__toggle .wl-icon {
      width: 14px;
      height: 14px;
      transition: transform 130ms ease;
    }

    .wl-lane__toggle[aria-expanded="false"] .wl-icon {
      transform: rotate(-90deg);
    }

    .wl-lane__icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 8px;
      color: var(--wl-lane-color, var(--wl-primary));
      background: color-mix(in srgb, var(--wl-lane-color, var(--wl-primary)) 10%, white);
    }

    .wl-lane__copy {
      min-width: 0;
      display: grid;
    }

    .wl-lane__eyebrow {
      color: var(--wl-text-muted);
      font-size: 9.5px;
      font-weight: 710;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .wl-lane__title {
      overflow: hidden;
      font-size: 12.8px;
      font-weight: 680;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wl-lane__meta {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--wl-text-muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .wl-progress {
      width: 96px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .wl-progress__track {
      height: 5px;
      flex: 1;
      overflow: hidden;
      border-radius: 3px;
      background: var(--wl-border);
    }

    .wl-progress__fill {
      height: 100%;
      display: block;
      border-radius: inherit;
      background: var(--wl-lane-color, var(--wl-primary));
    }

    .wl-progress__value {
      width: 27px;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .wl-lane__board {
      display: grid;
      grid-template-columns: repeat(var(--wl-board-visible-columns), minmax(var(--wl-board-column), 1fr));
      gap: 12px;
      align-items: start;
    }

    .wl-board-cell {
      min-height: 132px;
      padding: 8px;
      display: grid;
      align-content: start;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: var(--wl-radius-md);
      background: var(--wl-surface-soft);
      transition: border-color 120ms ease, background 120ms ease;
    }

    .wl-board-cell--over {
      border-color: var(--wl-primary);
      background: var(--wl-primary-soft);
    }

    .wl-board-cell--empty {
      min-height: 92px;
    }

    .wl-cell-empty {
      min-height: 52px;
      display: grid;
      place-items: center;
      color: var(--wl-text-muted);
      font-size: 10.5px;
    }

    .wl-add-card {
      width: 100%;
      min-height: 30px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 7px;
      color: var(--wl-text-muted);
      font-size: 11px;
      text-align: left;
      opacity: 0;
      transition: color 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    .wl-board-cell:hover .wl-add-card,
    .wl-add-card:focus-visible {
      opacity: 1;
    }

    .wl-add-card:hover {
      color: var(--wl-primary);
      background: #fff;
    }

    .wl-task-card {
      position: relative;
      padding: 11px;
      display: grid;
      gap: 9px;
      border: 1px solid var(--wl-border);
      border-radius: 10px;
      background: var(--wl-surface);
      box-shadow: var(--wl-shadow-sm);
      cursor: pointer;
      transition: border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
    }

    .wl-task-card:hover {
      border-color: var(--wl-border-strong);
      box-shadow: 0 5px 14px rgba(20, 30, 42, 0.08);
      transform: translateY(-1px);
    }

    .wl-task-card[draggable="true"] {
      cursor: grab;
    }

    .wl-task-card[draggable="true"]:active {
      cursor: grabbing;
    }

    .wl-task-card--dragging {
      opacity: 0.45;
      transform: rotate(1deg);
    }

    .wl-task-card--blocked {
      border-color: #f1c8ce;
    }

    .wl-task-card--done {
      opacity: 0.74;
    }

    .wl-task-card--compact {
      gap: 6px;
      padding: 9px;
    }

    .wl-task-card__top {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wl-type-icon {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .wl-type-icon--story {
      color: #d27716;
    }

    .wl-type-icon--task {
      color: var(--wl-primary);
    }

    .wl-type-icon--subtask {
      color: var(--wl-success);
    }

    .wl-task-card__key {
      color: var(--wl-text-muted);
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
    }

    .wl-priority {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--wl-priority-color, var(--wl-text-muted));
      font-size: 10px;
      font-weight: 650;
    }

    .wl-priority .wl-icon {
      width: 13px;
      height: 13px;
    }

    .wl-card-menu {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: var(--wl-text-muted);
      opacity: 0;
    }

    .wl-task-card:hover .wl-card-menu,
    .wl-card-menu:focus-visible {
      opacity: 1;
    }

    .wl-task-card__title {
      margin: 0;
      font-size: 12.5px;
      font-weight: 630;
      line-height: 1.42;
    }

    .wl-task-card--done .wl-task-card__title {
      color: var(--wl-text-muted);
      text-decoration: line-through;
    }

    .wl-task-card__context {
      overflow: hidden;
      color: var(--wl-text-muted);
      font-size: 10.5px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wl-blocker {
      padding: 7px 8px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      border-radius: 7px;
      color: var(--wl-danger);
      background: var(--wl-danger-soft);
      font-size: 10.5px;
      line-height: 1.35;
    }

    .wl-blocker .wl-icon {
      width: 13px;
      height: 13px;
      margin-top: 1px;
    }

    .wl-task-card__meta {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--wl-text-muted);
      font-size: 10.5px;
    }

    .wl-project {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .wl-project__dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--wl-project-color, var(--wl-primary));
    }

    .wl-project__name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wl-task-card__bottom {
      padding-top: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wl-task-card__bottom .wl-avatar {
      width: 24px;
      height: 24px;
      font-size: 8.5px;
    }

    .wl-due {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--wl-text-muted);
      font-size: 10.5px;
      white-space: nowrap;
    }

    .wl-due .wl-icon {
      width: 12px;
      height: 12px;
    }

    .wl-due--overdue {
      color: var(--wl-danger);
      font-weight: 650;
    }

    .wl-card-signals {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--wl-text-muted);
      font-size: 10px;
    }

    .wl-card-signals span {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .wl-card-signals .wl-icon {
      width: 12px;
      height: 12px;
    }

    .wl-empty {
      padding: 70px 24px;
      display: grid;
      justify-items: center;
      border: 1px dashed var(--wl-border-strong);
      border-radius: var(--wl-radius-md);
      color: var(--wl-text-secondary);
      text-align: center;
    }

    .wl-empty__icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: var(--wl-primary);
      background: var(--wl-primary-soft);
    }

    .wl-empty h2 {
      margin: 16px 0 4px;
      color: var(--wl-text);
      font-size: 16px;
    }

    .wl-empty p {
      margin: 0 0 18px;
      font-size: 12.5px;
    }

    .wl-drawer-backdrop,
    .wl-modal-backdrop,
    .wl-sidebar-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      visibility: hidden;
      background: rgba(17, 26, 35, 0.28);
      opacity: 0;
      transition: opacity 170ms ease, visibility 170ms ease;
    }

    .wl-drawer-backdrop--visible,
    .wl-modal-backdrop--visible,
    .wl-sidebar-backdrop--visible {
      visibility: visible;
      opacity: 1;
    }

    .wl-drawer {
      position: fixed;
      z-index: 80;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(520px, 92vw);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--wl-surface);
      box-shadow: -18px 0 50px rgba(19, 31, 45, 0.15);
      transform: translateX(104%);
      transition: transform 190ms ease;
    }

    .wl-drawer--visible {
      transform: translateX(0);
    }

    .wl-drawer__head {
      padding: 17px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--wl-border);
    }

    .wl-drawer__head-copy {
      min-width: 0;
      flex: 1;
      display: grid;
    }

    .wl-drawer__eyebrow {
      color: var(--wl-text-muted);
      font-size: 10.5px;
      font-weight: 710;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .wl-drawer__head-title {
      margin-top: 2px;
      overflow: hidden;
      font-size: 13px;
      font-weight: 660;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wl-drawer__body {
      padding: 24px;
      overflow: auto;
    }

    .wl-drawer__title {
      margin: 0;
      font-size: 23px;
      font-weight: 730;
      letter-spacing: -0.03em;
      line-height: 1.25;
    }

    .wl-drawer__description {
      margin: 20px 0 0;
      color: var(--wl-text-secondary);
      font-size: 13px;
      line-height: 1.7;
    }

    .wl-detail-grid {
      margin: 24px 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      gap: 13px 16px;
    }

    .wl-detail-grid dt {
      color: var(--wl-text-muted);
      font-size: 11.5px;
    }

    .wl-detail-grid dd {
      min-width: 0;
      margin: 0;
      font-size: 12.5px;
      font-weight: 570;
    }

    .wl-drawer__footer {
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--wl-border);
      background: var(--wl-surface-soft);
    }

    .wl-modal-backdrop {
      z-index: 90;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .wl-modal {
      width: min(540px, 100%);
      overflow: hidden;
      border: 1px solid var(--wl-border);
      border-radius: var(--wl-radius-lg);
      background: var(--wl-surface);
      box-shadow: var(--wl-shadow-md);
      transform: translateY(12px) scale(0.98);
      transition: transform 170ms ease;
    }

    .wl-modal-backdrop--visible .wl-modal {
      transform: none;
    }

    .wl-modal__head {
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--wl-border);
    }

    .wl-modal__title {
      margin: 0;
      font-size: 16px;
      font-weight: 710;
    }

    .wl-form {
      padding: 20px;
      display: grid;
      gap: 16px;
    }

    .wl-form__row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .wl-form__field {
      display: grid;
      gap: 6px;
    }

    .wl-form__field label {
      color: var(--wl-text-secondary);
      font-size: 11.5px;
      font-weight: 620;
    }

    .wl-input,
    .wl-form__select {
      width: 100%;
      height: 40px;
      padding: 0 11px;
      border: 1px solid var(--wl-border);
      border-radius: var(--wl-radius-sm);
      outline: 0;
      background: var(--wl-surface);
    }

    .wl-input:focus,
    .wl-form__select:focus {
      border-color: var(--wl-primary);
      box-shadow: 0 0 0 3px var(--wl-primary-soft);
    }

    .wl-modal__footer {
      padding: 13px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--wl-border);
      background: var(--wl-surface-soft);
    }

    .wl-toast {
      position: fixed;
      z-index: 110;
      right: 22px;
      bottom: 22px;
      max-width: min(380px, calc(100vw - 32px));
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-radius: 10px;
      color: #fff;
      background: #202a34;
      box-shadow: var(--wl-shadow-md);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .wl-toast--visible {
      transform: none;
      opacity: 1;
    }

    .wl-toast .wl-icon {
      color: #78e2ba;
    }

    .wl-mobile-nav {
      display: none;
    }

    .wl-density-compact .wl-task-card {
      gap: 6px;
      padding: 9px;
    }

    .wl-density-compact .wl-task-card__context,
    .wl-density-compact .wl-card-signals {
      display: none;
    }

    @media (max-width: 1240px) {
      :root {
        --wl-sidebar-width: 76px;
      }

      .wl-brand {
        padding: 0;
        justify-content: center;
      }

      .wl-brand__name,
      .wl-brand__env,
      .wl-nav__label,
      .wl-nav__text,
      .wl-nav__badge,
      .wl-profile__copy {
        display: none;
      }

      .wl-nav__item,
      .wl-profile {
        justify-content: center;
      }

      .wl-controls__spacer {
        display: none;
      }
    }

    @media (max-width: 900px) {
      .wl-page {
        padding-right: 18px;
        padding-left: 18px;
      }

      .wl-field--search {
        width: 100%;
        flex-basis: 100%;
      }

      .wl-controls__main .wl-segmented {
        order: 3;
      }
    }

    @media (max-width: 760px) {
      :root {
        --wl-header-height: 56px;
      }

      .wl-app {
        height: 100dvh;
        display: block;
      }

      .wl-sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 248px;
        min-height: 0;
        box-shadow: var(--wl-shadow-md);
        transform: translateX(-105%);
        transition: transform 180ms ease;
      }

      .wl-sidebar--visible {
        transform: translateX(0);
      }

      .wl-brand {
        padding: 0 18px;
        justify-content: flex-start;
      }

      .wl-brand__name,
      .wl-brand__env,
      .wl-nav__label,
      .wl-nav__text,
      .wl-nav__badge,
      .wl-profile__copy {
        display: initial;
      }

      .wl-brand__env {
        display: inline-block;
      }

      .wl-nav__item,
      .wl-profile {
        justify-content: flex-start;
      }

      .wl-main {
        height: 100dvh;
        min-height: 0;
      }

      .wl-topbar {
        padding: 0 12px;
        gap: 9px;
      }

      .wl-mobile-menu {
        display: inline-grid;
      }

      .wl-workspace {
        flex: 1;
      }

      .wl-workspace__name {
        max-width: 150px;
      }

      .wl-global-search,
      .wl-topbar > .wl-icon-button:last-child {
        display: none;
      }

      .wl-page {
        padding: 20px 12px 88px;
      }

      .wl-page-header {
        align-items: center;
      }

      .wl-page-subtitle {
        max-width: 270px;
        font-size: 12px;
      }

      .wl-page-actions .wl-button:not(.wl-button--primary) {
        display: none;
      }

      .wl-page-actions .wl-button--primary {
        width: 38px;
        padding: 0;
      }

      .wl-page-actions .wl-button--primary span {
        display: none;
      }

      .wl-summary {
        margin-top: 18px;
        gap: 22px;
      }

      .wl-controls {
        margin-top: 20px;
      }

      .wl-controls__main {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .wl-field--search {
        width: 100%;
        grid-column: 1 / -1;
      }

      .wl-select-wrap,
      .wl-select {
        width: 100%;
        min-width: 0;
      }

      .wl-controls__main .wl-segmented {
        grid-column: 1 / -1;
        order: initial;
      }

      .wl-segmented__button {
        flex: 1;
        justify-content: center;
      }

      .wl-controls__main > .wl-icon-button {
        position: absolute;
        top: 46px;
        right: 0;
      }

      .wl-controls__secondary {
        overflow-x: auto;
      }

      .wl-mobile-status {
        display: flex;
      }

      .wl-board-region {
        margin-top: 12px;
      }

      .wl-board-scroll {
        overflow: visible;
      }

      .wl-board-canvas {
        min-width: 0;
      }

      .wl-status-head {
        display: none;
      }

      .wl-lanes {
        gap: 16px;
      }

      .wl-lane__header {
        min-height: 48px;
        padding-right: 4px;
        padding-left: 4px;
      }

      .wl-lane__meta .wl-progress,
      .wl-lane__meta > span:first-child {
        display: none;
      }

      .wl-lane__board {
        display: block;
      }

      .wl-board-cell {
        min-height: 86px;
        padding: 8px;
      }

      .wl-add-card {
        opacity: 1;
      }

      .wl-task-card:hover {
        transform: none;
      }

      .wl-card-menu {
        opacity: 1;
      }

      .wl-mobile-nav {
        position: fixed;
        z-index: 50;
        right: 0;
        bottom: 0;
        left: 0;
        height: 62px;
        padding: 5px 8px max(5px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--wl-border);
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(12px);
      }

      .wl-mobile-nav__item {
        min-width: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        border-radius: 8px;
        color: var(--wl-text-muted);
        font-size: 9.5px;
      }

      .wl-mobile-nav__item[aria-current="page"] {
        color: var(--wl-primary);
      }

      .wl-mobile-nav__item .wl-icon {
        width: 19px;
        height: 19px;
      }

      .wl-drawer {
        top: 32px;
        width: 100vw;
        border-radius: 16px 16px 0 0;
      }

      .wl-drawer__body {
        padding: 20px 18px;
      }

      .wl-form__row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {
      .wl-controls__main {
        grid-template-columns: 1fr;
      }

      .wl-field--search,
      .wl-controls__main .wl-segmented {
        grid-column: 1;
      }

      .wl-controls__main > .wl-icon-button {
        top: 138px;
      }

      .wl-page-title {
        font-size: 23px;
      }

      .wl-page-subtitle {
        max-width: 220px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms;
      }
    }
  </style>

        { id: "WL-71", title: "Согласовать контракт расписания", type: "task", epic: "notifications", story: "digest", project: "mobile", status: "blocked", priority: "high", owner: "ip", due: "просрочено", overdue: true, comments: 7, attachments: 0, blocker: "Не согласованы timezone и DST", description: "Нужно согласовать timezone и правила перехода на летнее время." },
        { id: "WL-82", title: "Обновить базу знаний поддержки", type: "story", epic: "release", story: "knowledge", project: "ops", status: "progress", priority: "medium", owner: "as", due: "5 авг", comments: 2, attachments: 4, description: "Обновить инструкции и типовые ответы первой линии." },
        { id: "WL-83", title: "Собрать список изменённых сценариев", type: "task", epic: "release", story: "knowledge", project: "ops", status: "done", priority: "low", owner: "as", due: "24 июл", comments: 1, attachments: 1, description: "Сверить релизный scope с базой знаний." },
        { id: "WL-84", title: "Записать короткие GIF-инструкции", type: "task", epic: "release", story: "knowledge", project: "ops", status: "planned", priority: "medium", owner: "as", due: "2 авг", comments: 0, attachments: 0, description: "Подготовить инструкции по трём новым сценариям." },
        { id: "WL-85", title: "Провести репетицию релиза", type: "story", epic: "release", story: "rehearsal", project: "ops", status: "planned", priority: "high", owner: "ea", due: "7 авг", comments: 2, attachments: 1, description: "Пройти чек-лист релиза вместе с разработкой и поддержкой." }
      ];

      const state = {
        mode: "epic",
        search: "",
        project: "all",
        priority: "all",
        owner: "all",
        showDone: true,
        compact: false,
        mobileStatus: "progress",
        collapsed: new Set(),
        activeDrawerId: null,
        pendingGroup: null,
        dragId: null
      };

      const $ = (selector, context = document) => context.querySelector(selector);
      const $$ = (selector, context = document) => Array.from(context.querySelectorAll(selector));
      const icon = (name, small = false) => `<svg class="wl-icon${small ? " wl-icon--sm" : ""}" aria-hidden="true"><use href="#wl-i-${name}"></use></svg>`;
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" })[character]);
      const mobileQuery = window.matchMedia("(max-width: 760px)");

      const board = $("#wl-board");
      const searchInput = $("#wl-search");
      const projectFilter = $("#wl-project-filter");
      const priorityFilter = $("#wl-priority-filter");
      const ownerFilter = $("#wl-owner-filter");
      const drawer = $("#wl-drawer");
      const drawerBackdrop = $("#wl-drawer-backdrop");
      const modalBackdrop = $("#wl-modal-backdrop");
      const sidebar = $("#wl-sidebar");
      const sidebarBackdrop = $("#wl-sidebar-backdrop");
      let toastTimer;

      function filteredItems() {
        const query = state.search.trim().toLocaleLowerCase("ru");
        return items.filter((item) => {
          const epic = EPICS[item.epic];
          const story = STORIES[item.story];
          const haystack = `${item.id} ${item.title} ${epic?.title || ""} ${story?.title || ""}`.toLocaleLowerCase("ru");
          return (!query || haystack.includes(query))
            && (state.project === "all" || item.project === state.project)
            && (state.priority === "all" || item.priority === state.priority)
            && (state.owner === "all" || item.owner === state.owner)
            && (state.showDone || item.status !== "done");
        });
      }

      function groupsFor(sourceItems) {
        if (state.mode === "flat") {
          return [{ id: "all", type: "flat", title: "Все задачи", project: null, progress: 0, due: "", owner: null, items: sourceItems }];
        }

        if (state.mode === "epic") {
          return Object.entries(EPICS).map(([key, epic]) => ({
            id: key,
            type: "epic",
            title: epic.title,
            key: epic.id,
            project: epic.project,
            progress: epic.progress,
            due: epic.due,
            owner: epic.owner,
            items: sourceItems.filter((item) => item.epic === key)
          })).filter((group) => group.items.length);
        }

        return Object.entries(STORIES).map(([key, story]) => {
          const epic = EPICS[story.epic];
          return {
            id: key,
            type: "story",
            title: story.title,
            key: story.id,
            project: epic.project,
            progress: story.progress,
            due: story.due,
            owner: story.owner,
            items: sourceItems.filter((item) => item.story === key && item.id !== story.id)
          };
        }).filter((group) => group.items.length);
      }

      function contextFor(item) {
        const epic = EPICS[item.epic];
        const story = STORIES[item.story];
        if (state.mode === "flat") return `${epic.title} › ${story.title}`;
        if (state.mode === "epic") return item.type === "story" ? "История" : story.title;
        return TYPES[item.type].label;
      }

      function cardTemplate(item) {
        const type = TYPES[item.type];
        const project = PROJECTS[item.project];
        const owner = OWNERS[item.owner];
        const priority = PRIORITIES[item.priority];
        const classes = [
          "wl-task-card",
          item.status === "blocked" ? "wl-task-card--blocked" : "",
          item.status === "done" ? "wl-task-card--done" : "",
          state.compact ? "wl-task-card--compact" : ""
        ].filter(Boolean).join(" ");
        return `
          <article class="${classes}" data-card-id="${item.id}" draggable="${!mobileQuery.matches}" tabindex="0" aria-label="${type.label} ${item.id}: ${item.title}">
            <div class="wl-task-card__top">
              <span class="wl-type-icon wl-type-icon--${item.type}" title="${type.label}">${icon(type.icon, true)}</span>
              <span class="wl-task-card__key">${item.id}</span>
              <span class="wl-priority" style="--wl-priority-color:${priority.color}" title="${priority.label}">${icon("flag", true)}${priority.short}</span>
              <button class="wl-card-menu" type="button" data-card-menu="${item.id}" aria-label="Действия с ${item.id}">${icon("more", true)}</button>
            </div>
            <h3 class="wl-task-card__title">${item.title}</h3>
            <div class="wl-task-card__context">${contextFor(item)}</div>
            ${item.blocker ? `<div class="wl-blocker">${icon("alert", true)}<span>${item.blocker}</span></div>` : ""}
            <div class="wl-task-card__meta">
              <span class="wl-project"><span class="wl-project__dot" style="--wl-project-color:${project.color}"></span><span class="wl-project__name">${project.name}</span></span>
            </div>
            <div class="wl-task-card__bottom">
              <span class="wl-avatar" style="--wl-avatar-color:${owner.color}" title="${owner.name}">${owner.initials}</span>
              <time class="wl-due${item.overdue ? " wl-due--overdue" : ""}">${icon("clock", true)}${item.due}</time>
              <span class="wl-card-signals">
                ${item.comments ? `<span>${icon("comment", true)}${item.comments}</span>` : ""}
                ${item.attachments ? `<span>${icon("paperclip", true)}${item.attachments}</span>` : ""}
              </span>
            </div>
          </article>
        `;
      }

      function statusHeadTemplate(sourceItems) {
        return STATUSES.filter((status) => state.showDone || status.id !== "done").map((status) => {
          const count = sourceItems.filter((item) => item.status === status.id).length;
          const over = status.limit < 99 && count > status.limit;
          return `
            <div class="wl-status-head__item">
              <span class="wl-status-dot" style="--wl-status-color:${status.color}"></span>
              <span class="wl-status-head__label">${status.label}</span>
              <span class="wl-status-head__count">${count}</span>
              <span class="wl-wip${over ? " wl-wip--over" : ""}">${status.limit < 99 ? `${count}/${status.limit}` : ""}</span>
            </div>
          `;
        }).join("");
      }

      function laneHeaderTemplate(group) {
        if (group.type === "flat") return "";
        const project = PROJECTS[group.project];
        const owner = OWNERS[group.owner];
        return `
          <header class="wl-lane__header">
            <button class="wl-lane__toggle" type="button" data-toggle-group="${group.id}" aria-label="${state.collapsed.has(group.id) ? "Развернуть" : "Свернуть"} ${group.title}" aria-expanded="${!state.collapsed.has(group.id)}">${icon("chevron", true)}</button>
            <span class="wl-lane__icon" style="--wl-lane-color:${project.color}">${icon(group.type === "epic" ? "layers" : "story", true)}</span>
            <span class="wl-lane__copy"><span class="wl-lane__eyebrow">${group.type === "epic" ? "Эпик" : "История"} · ${group.key}</span><span class="wl-lane__title">${group.title}</span></span>
            <span class="wl-lane__meta">
              <span>${group.items.length} элементов</span>
              <span class="wl-progress" style="--wl-lane-color:${project.color}"><span class="wl-progress__track"><span class="wl-progress__fill" style="width:${group.progress}%"></span></span><span class="wl-progress__value">${group.progress}%</span></span>
              <span class="wl-avatar" style="--wl-avatar-color:${owner.color}" title="${owner.name}">${owner.initials}</span>
              <time>${group.due}</time>
            </span>
          </header>
        `;
      }

      function desktopLaneTemplate(group) {
        const statuses = STATUSES.filter((status) => state.showDone || status.id !== "done");
        return `
          <section class="wl-lane${group.type === "flat" ? " wl-lane--flat" : ""}">
            ${laneHeaderTemplate(group)}
            ${state.collapsed.has(group.id) ? "" : `
              <div class="wl-lane__board">
                ${statuses.map((status) => {
                  const cards = group.items.filter((item) => item.status === status.id);
                  return `
                    <div class="wl-board-cell${cards.length ? "" : " wl-board-cell--empty"}" data-drop-status="${status.id}" data-drop-group="${group.id}">
                      ${cards.map(cardTemplate).join("")}
                      ${cards.length ? "" : `<div class="wl-cell-empty">Нет задач</div>`}
                      <button class="wl-add-card" type="button" data-add-status="${status.id}" data-add-group="${group.id}">${icon("plus", true)}Добавить</button>
                    </div>
                  `;
                }).join("")}
              </div>
            `}
          </section>
        `;
      }

      function mobileLaneTemplate(group) {
        const cards = group.items.filter((item) => item.status === state.mobileStatus);
        if (!cards.length) return "";
        return `
          <section class="wl-lane${group.type === "flat" ? " wl-lane--flat" : ""}">
            ${laneHeaderTemplate(group)}
            ${state.collapsed.has(group.id) ? "" : `
              <div class="wl-lane__board">
                <div class="wl-board-cell" data-drop-status="${state.mobileStatus}" data-drop-group="${group.id}">
                  ${cards.map(cardTemplate).join("")}
                  <button class="wl-add-card" type="button" data-add-status="${state.mobileStatus}" data-add-group="${group.id}">${icon("plus", true)}Добавить</button>
                </div>
              </div>
            `}
          </section>
        `;
      }

      function renderMobileStatus(sourceItems) {
        $("#wl-mobile-status").innerHTML = STATUSES.filter((status) => state.showDone || status.id !== "done").map((status) => {
          const count = sourceItems.filter((item) => item.status === status.id).length;
          return `<button class="wl-mobile-status__button" type="button" data-mobile-status="${status.id}" aria-pressed="${state.mobileStatus === status.id}"><span class="wl-status-dot" style="--wl-status-color:${status.color}"></span>${status.label}<span>${count}</span></button>`;
        }).join("");
      }

      function renderBoard() {
        const sourceItems = filteredItems();
        const groups = groupsFor(sourceItems);
        $("#wl-status-head").innerHTML = statusHeadTemplate(sourceItems);
        renderMobileStatus(sourceItems);
        const laneHtml = mobileQuery.matches
          ? groups.map(mobileLaneTemplate).join("")
          : groups.map(desktopLaneTemplate).join("");

        board.innerHTML = laneHtml || `
          <div class="wl-empty">
            <span class="wl-empty__icon">${icon("search")}</span>
            <h2>На доске ничего не найдено</h2>
            <p>Измените фильтры или переключите статус.</p>
            <button class="wl-button" type="button" data-clear-empty>Сбросить фильтры</button>
          </div>
        `;
        $("#wl-results").textContent = hasActiveFilters() ? `Найдено: ${sourceItems.length}` : `Показано ${sourceItems.length} задач`;
        updateFilters();
        updateSummary();
        updateExpandButton();
      }

      function hasActiveFilters() {
        return Boolean(state.search.trim()) || state.project !== "all" || state.priority !== "all" || state.owner !== "all";
      }

      function updateFilters() {
        const filters = [];
        if (state.search.trim()) filters.push({ key: "search", label: `Поиск: ${state.search.trim()}` });
        if (state.project !== "all") filters.push({ key: "project", label: PROJECTS[state.project].name });
        if (state.priority !== "all") filters.push({ key: "priority", label: PRIORITIES[state.priority].label });
        if (state.owner !== "all") filters.push({ key: "owner", label: OWNERS[state.owner].name });
        $("#wl-active-filters").innerHTML = filters.map((filter) => `<button class="wl-filter-chip" type="button" data-remove-filter="${filter.key}"><span>${filter.label}</span>${icon("x", true)}</button>`).join("");
        $("#wl-clear-filters").hidden = filters.length === 0;
      }

      function updateSummary() {
        const active = items.filter((item) => item.status !== "done").length;
        const blocked = items.filter((item) => item.status === "blocked").length;
        const overdue = items.filter((item) => item.overdue && item.status !== "done").length;
        const done = items.filter((item) => item.status === "done").length;
        $("#wl-summary-active").textContent = active;
        $("#wl-summary-blocked").textContent = blocked;
        $("#wl-summary-overdue").textContent = overdue;
        $("#wl-summary-done").textContent = done;
        $("#wl-nav-count").textContent = active;
      }

      function updateExpandButton() {
        const groups = groupsFor(filteredItems()).filter((group) => group.type !== "flat");
        const allCollapsed = groups.length > 0 && groups.every((group) => state.collapsed.has(group.id));
        const button = $("#wl-expand-all");
        button.hidden = state.mode === "flat";
        button.innerHTML = `${icon("layers", true)}<span>${allCollapsed ? "Развернуть группы" : "Свернуть группы"}</span>`;
      }

      function groupIdForItem(item) {
        if (state.mode === "flat") return "all";
        return state.mode === "epic" ? item.epic : item.story;
      }

      function resetFilters() {
        state.search = "";
        state.project = "all";
        state.priority = "all";
        state.owner = "all";
        searchInput.value = "";
        projectFilter.value = "all";
        priorityFilter.value = "all";
        ownerFilter.value = "all";
        renderBoard();
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        $("#wl-toast-text").textContent = message;
        $("#wl-toast").classList.add("wl-toast--visible");
        toastTimer = window.setTimeout(() => $("#wl-toast").classList.remove("wl-toast--visible"), 2300);
      }

      function openDrawer(item) {
        state.activeDrawerId = item.id;
        const type = TYPES[item.type];
        const project = PROJECTS[item.project];
        const owner = OWNERS[item.owner];
        const priority = PRIORITIES[item.priority];
        const status = STATUSES.find((entry) => entry.id === item.status);
        const epic = EPICS[item.epic];
        const story = STORIES[item.story];
        $("#wl-drawer-type").textContent = type.label;
        $("#wl-drawer-key").textContent = item.id;
        $("#wl-drawer-body").innerHTML = `
          <h2 class="wl-drawer__title" id="wl-drawer-title">${item.title}</h2>
          <p class="wl-drawer__description">${item.description}</p>
          ${item.blocker ? `<div class="wl-blocker">${icon("alert", true)}<span>${item.blocker}</span></div>` : ""}
          <dl class="wl-detail-grid">
            <dt>Статус</dt><dd><span class="wl-status-dot" style="--wl-status-color:${status.color}"></span> ${status.label}</dd>
            <dt>Приоритет</dt><dd style="color:${priority.color}">${priority.label}</dd>
            <dt>Проект</dt><dd><span class="wl-project"><span class="wl-project__dot" style="--wl-project-color:${project.color}"></span>${project.name}</span></dd>
            <dt>Эпик</dt><dd>${epic.id} · ${epic.title}</dd>
            <dt>История</dt><dd>${story.id} · ${story.title}</dd>
            <dt>Исполнитель</dt><dd>${owner.name}</dd>
            <dt>Срок</dt><dd class="${item.overdue ? "wl-due--overdue" : ""}">${item.due}</dd>
          </dl>
        `;
        drawer.classList.add("wl-drawer--visible");
        drawerBackdrop.classList.add("wl-drawer-backdrop--visible");
        drawer.setAttribute("aria-hidden", "false");
        $("#wl-drawer-close").focus();
      }

      function closeDrawer() {
        drawer.classList.remove("wl-drawer--visible");
        drawerBackdrop.classList.remove("wl-drawer-backdrop--visible");
        drawer.setAttribute("aria-hidden", "true");
        state.activeDrawerId = null;
      }

      function storyOptions(project, selectedStory = "") {
        return Object.entries(STORIES)
          .filter(([, story]) => EPICS[story.epic].project === project)
          .map(([key, story]) => `<option value="${key}"${key === selectedStory ? " selected" : ""}>${story.id} · ${story.title}</option>`)
          .join("");
      }

      function openModal(status = "planned", groupId = null) {
        state.pendingGroup = groupId;
        let project = state.project !== "all" ? state.project : "atlas";
        let storyId = "";
        if (state.mode === "epic" && groupId && EPICS[groupId]) project = EPICS[groupId].project;
        if (state.mode === "story" && groupId && STORIES[groupId]) {
          storyId = groupId;
          project = EPICS[STORIES[groupId].epic].project;
        }
        $("#wl-new-project").value = project;
        $("#wl-new-status").value = status;
        $("#wl-new-story").innerHTML = storyOptions(project, storyId);
        modalBackdrop.classList.add("wl-modal-backdrop--visible");
        modalBackdrop.setAttribute("aria-hidden", "false");
        window.setTimeout(() => $("#wl-new-title").focus(), 20);
      }

      function closeModal() {
        modalBackdrop.classList.remove("wl-modal-backdrop--visible");
        modalBackdrop.setAttribute("aria-hidden", "true");
        $("#wl-create-form").reset();
        state.pendingGroup = null;
      }

      function closeSidebar() {
        sidebar.classList.remove("wl-sidebar--visible");
        sidebarBackdrop.classList.remove("wl-sidebar-backdrop--visible");
      }

      searchInput.addEventListener("input", () => {
        state.search = searchInput.value;
        renderBoard();
      });

      projectFilter.addEventListener("change", () => {
        state.project = projectFilter.value;
        renderBoard();
      });

      priorityFilter.addEventListener("change", () => {
        state.priority = priorityFilter.value;
        renderBoard();
      });

      ownerFilter.addEventListener("change", () => {
        state.owner = ownerFilter.value;
        renderBoard();
      });

      $("#wl-active-filters").addEventListener("click", (event) => {
        const chip = event.target.closest("[data-remove-filter]");
        if (!chip) return;
        const key = chip.dataset.removeFilter;
        if (key === "search") {
          state.search = "";
          searchInput.value = "";
        } else {
          state[key] = "all";
          $(`#wl-${key}-filter`).value = "all";
        }
        renderBoard();
      });

      $("#wl-clear-filters").addEventListener("click", resetFilters);

      $$("[data-mode]").forEach((button) => button.addEventListener("click", () => {
        state.mode = button.dataset.mode;
        state.collapsed.clear();
        $$("[data-mode]").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
        renderBoard();
      }));

      $("#wl-mobile-status").addEventListener("click", (event) => {
        const button = event.target.closest("[data-mobile-status]");
        if (!button) return;
        state.mobileStatus = button.dataset.mobileStatus;
        renderBoard();
      });

      board.addEventListener("click", (event) => {
        const clear = event.target.closest("[data-clear-empty]");
        if (clear) {
          resetFilters();
          return;
        }

        const toggle = event.target.closest("[data-toggle-group]");
        if (toggle) {
          const id = toggle.dataset.toggleGroup;
          state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
          renderBoard();
          return;
        }

        const add = event.target.closest("[data-add-status]");
        if (add) {
          openModal(add.dataset.addStatus, add.dataset.addGroup);
          return;
        }

        const menu = event.target.closest("[data-card-menu]");
        if (menu) {
          showToast(`Меню действий для ${menu.dataset.cardMenu}`);
          return;
        }

        const card = event.target.closest("[data-card-id]");
        if (card) openDrawer(items.find((item) => item.id === card.dataset.cardId));
      });

      board.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-card-id]");
        if (!card || event.target.closest("button")) return;
        event.preventDefault();
        openDrawer(items.find((item) => item.id === card.dataset.cardId));
      });

      board.addEventListener("dragstart", (event) => {
        const card = event.target.closest("[data-card-id]");
        if (!card) return;
        state.dragId = card.dataset.cardId;
        card.classList.add("wl-task-card--dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", state.dragId);
      });

      board.addEventListener("dragover", (event) => {
        const cell = event.target.closest("[data-drop-status]");
        const draggedItem = items.find((item) => item.id === state.dragId);
        if (!cell || !draggedItem || cell.dataset.dropGroup !== groupIdForItem(draggedItem)) return;
        event.preventDefault();
        $$(".wl-board-cell--over", board).forEach((item) => item.classList.remove("wl-board-cell--over"));
        cell.classList.add("wl-board-cell--over");
      });

      board.addEventListener("drop", (event) => {
        const cell = event.target.closest("[data-drop-status]");
        if (!cell || !state.dragId) return;
        const item = items.find((entry) => entry.id === state.dragId);
        if (cell.dataset.dropGroup !== groupIdForItem(item)) {
          showToast("Смена родителя выполняется из карточки задачи");
          return;
        }
        event.preventDefault();
        const previous = item.status;
        item.status = cell.dataset.dropStatus;
        showToast(`${item.id}: ${STATUSES.find((status) => status.id === previous).label} → ${STATUSES.find((status) => status.id === item.status).label}`);
        state.dragId = null;
        renderBoard();
      });

      board.addEventListener("dragend", () => {
        state.dragId = null;
        $$(".wl-task-card--dragging, .wl-board-cell--over", board).forEach((item) => item.classList.remove("wl-task-card--dragging", "wl-board-cell--over"));
      });

      $("#wl-expand-all").addEventListener("click", () => {
        const groups = groupsFor(filteredItems()).filter((group) => group.type !== "flat");
        const allCollapsed = groups.length && groups.every((group) => state.collapsed.has(group.id));
        state.collapsed.clear();
        if (!allCollapsed) groups.forEach((group) => state.collapsed.add(group.id));
        renderBoard();
      });

      $("#wl-view-settings").addEventListener("click", (event) => {
        event.stopPropagation();
        const popover = $("#wl-view-popover");
        const visible = popover.classList.toggle("wl-view-popover--visible");
        $("#wl-view-settings").setAttribute("aria-expanded", String(visible));
      });

      $("#wl-view-popover").addEventListener("click", (event) => event.stopPropagation());
      document.addEventListener("click", () => {
        $("#wl-view-popover").classList.remove("wl-view-popover--visible");
        $("#wl-view-settings").setAttribute("aria-expanded", "false");
      });

      $("#wl-compact-toggle").addEventListener("change", (event) => {
        state.compact = event.target.checked;
        document.body.classList.toggle("wl-density-compact", state.compact);
        renderBoard();
      });

      $("#wl-done-toggle").addEventListener("change", (event) => {
        state.showDone = event.target.checked;
        if (!state.showDone && state.mobileStatus === "done") state.mobileStatus = "progress";
        document.documentElement.style.setProperty("--wl-board-visible-columns", state.showDone ? "5" : "4");
        document.documentElement.style.setProperty("--wl-board-min-width", state.showDone ? "1408px" : "1124px");
        renderBoard();
      });

      $("#wl-create-task").addEventListener("click", () => openModal());
      $("#wl-new-project").addEventListener("change", (event) => {
        $("#wl-new-story").innerHTML = storyOptions(event.target.value);
      });
      $("#wl-modal-close").addEventListener("click", closeModal);
      $("#wl-modal-cancel").addEventListener("click", closeModal);
      modalBackdrop.addEventListener("click", (event) => {
        if (event.target === modalBackdrop) closeModal();
      });

      $("#wl-create-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const storyKey = $("#wl-new-story").value;
        const story = STORIES[storyKey];
        const epicKey = story.epic;
        const nextNumber = Math.max(...items.map((item) => Number(item.id.split("-")[1]) || 0)) + 1;
        const item = {
          id: `WL-${nextNumber}`,
          title: escapeHtml($("#wl-new-title").value.trim()),
          type: "task",
          epic: epicKey,
          story: storyKey,
          project: $("#wl-new-project").value,
          status: $("#wl-new-status").value,
          priority: $("#wl-new-priority").value,
          owner: "ea",
          due: "не задан",
          comments: 0,
          attachments: 0,
          description: "Новая задача создана в прототипе доски."
        };
        items.push(item);
        closeModal();
        resetFilters();
        showToast(`${item.id} создана`);
      });

      $("#wl-drawer-close").addEventListener("click", closeDrawer);
      drawerBackdrop.addEventListener("click", closeDrawer);
      $("#wl-drawer-advance").addEventListener("click", () => {
        const item = items.find((entry) => entry.id === state.activeDrawerId);
        if (!item) return;
        const currentIndex = STATUSES.findIndex((status) => status.id === item.status);
        item.status = STATUSES[Math.min(currentIndex + 1, STATUSES.length - 1)].id;
        showToast(`${item.id}: ${STATUSES.find((status) => status.id === item.status).label}`);
        closeDrawer();
        renderBoard();
      });

      $("#wl-global-search").addEventListener("click", () => searchInput.focus());
      $("#wl-mobile-menu").addEventListener("click", () => {
        sidebar.classList.add("wl-sidebar--visible");
        sidebarBackdrop.classList.add("wl-sidebar-backdrop--visible");
      });
      sidebarBackdrop.addEventListener("click", closeSidebar);

      document.addEventListener("keydown", (event) => {
        if (event.key === "/" && document.activeElement?.tagName !== "INPUT") {
          event.preventDefault();
          searchInput.focus();
        }
        if (event.key === "Escape") {
          closeDrawer();
          closeModal();
          closeSidebar();
          $("#wl-view-popover").classList.remove("wl-view-popover--visible");
        }
      });

      mobileQuery.addEventListener("change", renderBoard);
      renderBoard();
    })();
  </script>
</body>
</html>
