<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gavia UI — календарь</title>
  <style>
    @layer wl.reset, wl.tokens, wl.components;

    @layer wl.reset {
      *, *::before, *::after { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body, h1, h2, h3, p { margin: 0; }
      button, input, select, textarea { font: inherit; }
      button {
        color: inherit;
        border: 0;
        background: transparent;
      }
    }

    @layer wl.tokens {
      :root {
        color-scheme: light;
        --wl-font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --wl-bg: #ffffff;
        --wl-surface: #ffffff;
        --wl-surface-soft: #f7f9fb;
        --wl-surface-hover: #f3f6f9;
        --wl-border: #e7ebef;
        --wl-border-strong: #dce2e8;
        --wl-text: #17202a;
        --wl-text-muted: #697582;
        --wl-text-soft: #929ca7;
        --wl-blue: #2864dc;
        --wl-blue-hover: #1e52bd;
        --wl-blue-soft: #edf4ff;
        --wl-cyan: #1189a8;
        --wl-cyan-soft: #e9f8fb;
        --wl-violet: #7356c5;
        --wl-violet-soft: #f2effd;
        --wl-amber: #b97818;
        --wl-amber-soft: #fff5df;
        --wl-green: #18845d;
        --wl-green-soft: #eaf8f2;
        --wl-red: #c74d55;
        --wl-red-soft: #fff0f1;
        --wl-shadow: 0 18px 54px rgba(21, 35, 49, .14);
        --wl-shadow-soft: 0 6px 20px rgba(21, 35, 49, .08);
        --wl-radius-sm: 8px;
        --wl-radius-md: 12px;
        --wl-radius-lg: 18px;
        --wl-sidebar-width: 232px;
        --wl-topbar-height: 64px;
        --wl-content-max: 1540px;
      }
    }

    @layer wl.components {
      body {
        overflow: hidden;
        color: var(--wl-text);
        background: var(--wl-bg);
        font-family: var(--wl-font);
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      button, select { cursor: pointer; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--wl-blue) 38%, transparent);
        outline-offset: 2px;
      }

      .wl-icon {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }
      .wl-icon--sm { width: 16px; height: 16px; }
      .wl-icon--xs { width: 13px; height: 13px; }

      .wl-app {
        display: grid;
        height: 100dvh;
        min-height: 580px;
        grid-template-columns: var(--wl-sidebar-width) minmax(0, 1fr);
        background: var(--wl-bg);
      }

      .wl-sidebar {
        position: relative;
        z-index: 40;
        display: flex;
        min-width: 0;
        flex-direction: column;
        border-right: 1px solid var(--wl-border);
        background: var(--wl-surface);
      }

      .wl-brand {
        display: flex;
        height: var(--wl-topbar-height);
        align-items: center;
        gap: 10px;
        padding: 0 20px;
      }

      .wl-brand__mark {
        display: grid;
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        place-items: center;
        color: #fff;
        border-radius: 9px;
        background: var(--wl-blue);
      }
      .wl-brand__mark .wl-icon { width: 18px; height: 18px; stroke-width: 2.3; }
      .wl-brand__name { overflow: hidden; font-size: 16px; font-weight: 730; letter-spacing: -.02em; }
      .wl-brand__env { padding: 2px 6px; color: var(--wl-text-muted); border-radius: 5px; background: var(--wl-surface-soft); font-size: 10px; font-weight: 700; text-transform: uppercase; }

      .wl-nav { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 3px; padding: 14px 12px; }
      .wl-nav__label { margin: 16px 10px 6px; color: var(--wl-text-soft); font-size: 10px; font-weight: 730; letter-spacing: .09em; text-transform: uppercase; }
      .wl-nav__label:first-child { margin-top: 2px; }
      .wl-nav__item {
        display: flex;
        min-height: 42px;
        align-items: center;
        gap: 11px;
        padding: 0 11px;
        color: var(--wl-text-muted);
        border: 0;
        border-radius: 10px;
        background: transparent;
        text-align: left;
        transition: color .16s ease, background .16s ease;
      }
      .wl-nav__item:hover { color: var(--wl-text); background: var(--wl-surface-hover); }
      .wl-nav__item[aria-current="page"] { color: var(--wl-blue); background: var(--wl-blue-soft); font-weight: 650; }
      .wl-nav__text { overflow: hidden; flex: 1; text-overflow: ellipsis; white-space: nowrap; }
      .wl-nav__badge { min-width: 22px; padding: 2px 6px; color: var(--wl-text-muted); border-radius: 10px; background: var(--wl-surface-soft); font-size: 11px; text-align: center; }

      .wl-sidebar__footer { padding: 12px; border-top: 1px solid var(--wl-border); }
      .wl-profile { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px; border: 0; border-radius: 10px; background: transparent; text-align: left; }
      .wl-profile:hover { background: var(--wl-surface-hover); }
      .wl-avatar { display: inline-grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; color: #fff; border-radius: 50%; background: var(--wl-avatar-color, #65778b); font-size: 11px; font-weight: 720; }
      .wl-avatar--sm { width: 26px; height: 26px; font-size: 9px; }
      .wl-profile__copy { display: flex; min-width: 0; flex: 1; flex-direction: column; }
      .wl-profile__name { overflow: hidden; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
      .wl-profile__role { color: var(--wl-text-soft); font-size: 11px; }

      .wl-main { display: grid; min-width: 0; min-height: 0; grid-template-rows: var(--wl-topbar-height) minmax(0, 1fr); }
      .wl-topbar {
        position: relative;
        z-index: 30;
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 18px;
        padding: 0 26px;
        border-bottom: 1px solid var(--wl-border);
        background: var(--wl-surface);
      }
      .wl-workspace { display: flex; min-width: 0; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; }
      .wl-workspace__dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--wl-green); }
      .wl-workspace__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .wl-global-search {
        display: flex;
        width: min(440px, 42vw);
        min-width: 220px;
        align-items: center;
        gap: 9px;
        margin: 0 auto;
        padding: 8px 10px;
        color: var(--wl-text-soft);
        border: 1px solid var(--wl-border);
        border-radius: 9px;
        background: var(--wl-surface-soft);
      }
      .wl-global-search span { overflow: hidden; flex: 1; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
      .wl-key { padding: 1px 6px; color: var(--wl-text-muted); border: 1px solid var(--wl-border-strong); border-radius: 5px; background: var(--wl-surface); font-size: 11px; }

      .wl-icon-button {
        display: inline-grid;
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        place-items: center;
        padding: 0;
        color: var(--wl-text-muted);
        border: 0;
        border-radius: 9px;
        background: transparent;
      }
      .wl-icon-button:hover { color: var(--wl-text); background: var(--wl-surface-hover); }
      .wl-icon-button--bordered { border: 1px solid var(--wl-border); background: var(--wl-surface); }
      .wl-mobile-menu { display: none; }

      .wl-content { min-width: 0; min-height: 0; overflow: hidden; }
      .wl-calendar-page {
        display: grid;
        width: min(100%, var(--wl-content-max));
        height: 100%;
        min-height: 0;
        margin: 0 auto;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .wl-page-header {
        display: grid;
        grid-template-columns: minmax(230px, 1fr) auto auto;
        align-items: center;
        gap: 22px;
        padding: 26px 32px 20px;
      }
      .wl-eyebrow { margin-bottom: 4px; color: var(--wl-text-muted); font-size: 12px; }
      .wl-title { font-size: clamp(25px, 2.1vw, 32px); font-weight: 750; letter-spacing: -.035em; line-height: 1.15; }
      .wl-title-copy { margin-top: 6px; color: var(--wl-text-muted); font-size: 12px; }

      .wl-period-nav { display: flex; align-items: center; gap: 8px; }
      .wl-period-label { min-width: 160px; font-size: 15px; font-weight: 690; text-align: center; }
      .wl-page-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
      .wl-button {
        display: inline-flex;
        min-height: 38px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 14px;
        border: 1px solid var(--wl-border);
        border-radius: 9px;
        background: var(--wl-surface);
        font-weight: 650;
      }
      .wl-button:hover { background: var(--wl-surface-hover); }
      .wl-button--primary { color: #fff; border-color: var(--wl-blue); background: var(--wl-blue); }
      .wl-button--primary:hover { background: var(--wl-blue-hover); }

      .wl-calendar-shell {
        display: grid;
        min-width: 0;
        min-height: 0;
        grid-template-columns: minmax(0, 1fr) 320px;
        border-top: 1px solid var(--wl-border);
      }

      .wl-calendar-main { display: grid; min-width: 0; min-height: 0; grid-template-rows: auto minmax(0, 1fr); }
      .wl-calendar-toolbar {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--wl-border);
      }
      .wl-segmented { display: inline-flex; min-width: 0; padding: 3px; border: 1px solid var(--wl-border); border-radius: 10px; background: var(--wl-surface-soft); }
      .wl-segmented__item {
        min-height: 32px;
        padding: 0 13px;
        color: var(--wl-text-muted);
        border: 0;
        border-radius: 7px;
        background: transparent;
        font-size: 12px;
        font-weight: 620;
      }
      .wl-segmented__item[aria-pressed="true"] { color: var(--wl-blue); background: var(--wl-surface); box-shadow: 0 1px 3px rgba(22, 36, 50, .08); }
      .wl-toolbar-actions { display: flex; align-items: center; gap: 8px; }
      .wl-filter-button[data-active="true"] { color: var(--wl-blue); border-color: color-mix(in srgb, var(--wl-blue) 28%, var(--wl-border)); background: var(--wl-blue-soft); }
      .wl-filter-count { display: none; min-width: 18px; height: 18px; place-items: center; color: #fff; border-radius: 9px; background: var(--wl-blue); font-size: 10px; }
      .wl-filter-count--visible { display: inline-grid; }

      .wl-view-host { min-width: 0; min-height: 0; overflow: hidden; }
      .wl-view { display: none; width: 100%; height: 100%; min-height: 0; }
      .wl-view--active { display: block; }

      .wl-month-view { overflow: auto; padding: 14px 22px 26px; scrollbar-gutter: stable; }
      .wl-month-grid {
        display: grid;
        min-width: 720px;
        grid-template-columns: repeat(7, minmax(90px, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--wl-border);
        border-radius: 12px;
        background: var(--wl-border);
      }
      .wl-month-weekday {
        position: sticky;
        top: 0;
        z-index: 4;
        padding: 10px 10px 9px;
        color: var(--wl-text-soft);
        background: var(--wl-surface);
        font-size: 10px;
        font-weight: 720;
        letter-spacing: .07em;
        text-align: center;
        text-transform: uppercase;
      }
      .wl-month-day {
        position: relative;
        min-height: clamp(88px, 10.5vh, 106px);
        padding: 8px 9px;
        overflow: hidden;
        appearance: none;
        border: 0;
        background: var(--wl-surface);
        text-align: left;
        transition: background .14s ease, box-shadow .14s ease;
      }
      .wl-month-day:hover { background: var(--wl-surface-soft); }
      .wl-month-day[data-selected="true"] {
        z-index: 1;
        background: #f7faff;
        box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--wl-blue) 38%, transparent);
      }
      .wl-month-day[data-outside="true"] { color: var(--wl-text-soft); background: color-mix(in srgb, var(--wl-surface-soft) 55%, var(--wl-surface)); }
      .wl-month-day__number {
        display: grid;
        width: 24px;
        height: 24px;
        margin-left: auto;
        place-items: center;
        border-radius: 50%;
        font-size: 12px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .wl-month-day[data-today="true"] .wl-month-day__number { color: #fff; background: var(--wl-blue); }
      .wl-month-events { display: grid; gap: 4px; margin-top: 6px; }
      .wl-month-event {
        display: flex;
        min-width: 0;
        height: 24px;
        align-items: center;
        gap: 5px;
        padding: 0 7px;
        overflow: hidden;
        color: var(--wl-event-color);
        border: 0;
        border-radius: 6px;
        background: var(--wl-event-bg);
        font-size: 10.5px;
        font-weight: 620;
        text-align: left;
        white-space: nowrap;
      }
      .wl-month-event:hover { filter: saturate(1.15) brightness(.98); }
      .wl-month-event__time { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
      .wl-month-event__title { overflow: hidden; text-overflow: ellipsis; }
      .wl-month-more { padding: 2px 6px; color: var(--wl-text-muted); font-size: 10px; font-weight: 620; }

      .wl-week-view { overflow: auto; scrollbar-gutter: stable; }
      .wl-week-grid { position: relative; display: grid; min-width: 840px; grid-template-columns: 58px repeat(7, minmax(108px, 1fr)); }
      .wl-week-corner, .wl-week-head {
        position: sticky;
        top: 0;
        z-index: 7;
        min-height: 62px;
        border-bottom: 1px solid var(--wl-border);
        background: var(--wl-surface);
      }
      .wl-week-corner { left: 0; z-index: 8; }
      .wl-week-head { display: grid; place-items: center; padding: 8px; border-left: 1px solid var(--wl-border); }
      .wl-week-head__day { color: var(--wl-text-muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
      .wl-week-head__date { display: grid; width: 28px; height: 28px; margin-top: 3px; place-items: center; border-radius: 50%; font-size: 12px; font-weight: 700; }
      .wl-week-head[data-today="true"] .wl-week-head__date { color: #fff; background: var(--wl-blue); }
      .wl-week-time {
        position: sticky;
        left: 0;
        z-index: 3;
        height: 64px;
        padding: 6px 8px 0 0;
        color: var(--wl-text-soft);
        background: var(--wl-surface);
        font-size: 10px;
        text-align: right;
      }
      .wl-week-cell { position: relative; height: 64px; border-top: 1px solid var(--wl-border); border-left: 1px solid var(--wl-border); }
      .wl-week-cell:hover { background: var(--wl-surface-soft); }
      .wl-week-event {
        position: absolute;
        z-index: 4;
        min-width: 0;
        padding: 5px 6px;
        overflow: hidden;
        color: var(--wl-event-color);
        border: 0;
        border-left: 3px solid var(--wl-event-color);
        border-radius: 6px;
        background: var(--wl-event-bg);
        font-size: 9px;
        line-height: 1.3;
        text-align: left;
      }
      .wl-week-event strong { display: block; overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .wl-week-event span { opacity: .8; }

      .wl-schedule-view { overflow-y: auto; padding: 10px 26px 48px; scrollbar-gutter: stable; }
      .wl-schedule-day { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 22px; padding: 22px 0; }
      .wl-schedule-day + .wl-schedule-day { border-top: 1px solid var(--wl-border); }
      .wl-schedule-date { color: var(--wl-text-muted); font-size: 11px; }
      .wl-schedule-date strong { display: block; color: var(--wl-text); font-size: 14px; }
      .wl-schedule-date[data-today="true"] strong { color: var(--wl-blue); }
      .wl-schedule-events { display: grid; gap: 7px; }
      .wl-schedule-event {
        display: grid;
        min-width: 0;
        grid-template-columns: 62px 34px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--wl-surface);
        text-align: left;
      }
      .wl-schedule-event:hover { border-color: var(--wl-border); box-shadow: var(--wl-shadow-soft); }
      .wl-schedule-event__time { color: var(--wl-text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      .wl-event-icon { display: grid; width: 32px; height: 32px; place-items: center; color: var(--wl-event-color); border-radius: 9px; background: var(--wl-event-bg); }
      .wl-schedule-event__copy { min-width: 0; }
      .wl-schedule-event__title { overflow: hidden; font-size: 12px; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
      .wl-schedule-event__meta { overflow: hidden; margin-top: 2px; color: var(--wl-text-muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .wl-schedule-event__project { padding: 3px 7px; color: var(--wl-text-muted); border-radius: 6px; background: var(--wl-surface-soft); font-size: 9px; white-space: nowrap; }

      .wl-agenda {
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        border-left: 1px solid var(--wl-border);
        background: var(--wl-surface);
        scrollbar-gutter: stable;
      }
      .wl-agenda__head {
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 22px 22px 14px;
        border-bottom: 1px solid var(--wl-border);
        background: color-mix(in srgb, var(--wl-surface) 95%, transparent);
        backdrop-filter: blur(12px);
      }
      .wl-agenda__date { font-size: 17px; font-weight: 730; letter-spacing: -.02em; }
      .wl-agenda__summary { margin-top: 4px; color: var(--wl-text-muted); font-size: 11px; }
      .wl-agenda__body { padding: 15px 16px 50px; }
      .wl-agenda-event {
        position: relative;
        display: grid;
        grid-template-columns: 47px 8px minmax(0, 1fr);
        gap: 10px;
        padding: 11px 8px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        text-align: left;
      }
      .wl-agenda-event:hover { background: var(--wl-surface-hover); }
      .wl-agenda-event__time { color: var(--wl-text-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
      .wl-agenda-event__dot { width: 8px; height: 8px; margin-top: 4px; border-radius: 50%; background: var(--wl-event-color); }
      .wl-agenda-event__title { display: block; font-size: 12px; font-weight: 680; line-height: 1.45; }
      .wl-agenda-event__meta { display: block; margin-top: 3px; color: var(--wl-text-muted); font-size: 10px; line-height: 1.45; }
      .wl-agenda-event__people { display: flex; margin-top: 7px; }
      .wl-agenda-event__people .wl-avatar { margin-right: -5px; border: 2px solid var(--wl-surface); }
      .wl-agenda-empty { display: grid; min-height: 260px; place-items: center; padding: 34px 18px; text-align: center; }
      .wl-agenda-empty__icon { display: grid; width: 48px; height: 48px; margin: 0 auto 12px; place-items: center; color: var(--wl-blue); border-radius: 14px; background: var(--wl-blue-soft); }
      .wl-agenda-empty__title { font-size: 14px; font-weight: 700; }
      .wl-agenda-empty__copy { margin-top: 5px; color: var(--wl-text-muted); font-size: 11px; }

      .wl-filter-popover {
        position: fixed;
        z-index: 70;
        display: none;
        width: 300px;
        padding: 16px;
        border: 1px solid var(--wl-border);
        border-radius: 13px;
        background: var(--wl-surface);
        box-shadow: var(--wl-shadow);
      }
      .wl-filter-popover--visible { display: block; }
      .wl-filter-popover__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .wl-filter-popover__title { font-size: 13px; font-weight: 700; }
      .wl-filter-group + .wl-filter-group { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--wl-border); }
      .wl-filter-group__label { margin-bottom: 7px; color: var(--wl-text-soft); font-size: 9px; font-weight: 720; letter-spacing: .07em; text-transform: uppercase; }
      .wl-check {
        display: flex;
        min-height: 32px;
        align-items: center;
        gap: 9px;
        padding: 4px 6px;
        border-radius: 7px;
        font-size: 11px;
      }
      .wl-check:hover { background: var(--wl-surface-hover); }
      .wl-check input { width: 15px; height: 15px; margin: 0; accent-color: var(--wl-blue); }
      .wl-check__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wl-check-color); }
      .wl-filter-reset { color: var(--wl-blue); border: 0; background: transparent; font-size: 10px; font-weight: 650; }

      .wl-modal-backdrop, .wl-sidebar-backdrop, .wl-drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        background: rgba(20, 30, 42, .25);
        backdrop-filter: blur(2px);
      }
      .wl-modal-backdrop--visible, .wl-sidebar-backdrop--visible, .wl-drawer-backdrop--visible { display: block; }
      .wl-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 80;
        display: none;
        width: min(560px, calc(100vw - 32px));
        max-height: calc(100dvh - 40px);
        overflow-y: auto;
        border: 1px solid var(--wl-border);
        border-radius: 16px;
        background: var(--wl-surface);
        box-shadow: var(--wl-shadow);
        transform: translate(-50%, -50%);
      }

  <section class="wl-modal" id="wl-event-modal" role="dialog" aria-modal="true" aria-labelledby="wl-modal-title">
    <header class="wl-modal__head"><h2 class="wl-modal__title" id="wl-modal-title">Новое событие</h2><button class="wl-icon-button" id="wl-modal-close" type="button" aria-label="Закрыть"><svg class="wl-icon"><use href="#wl-i-x"></use></svg></button></header>
    <form class="wl-modal__body" id="wl-event-form">
      <div class="wl-field"><label for="wl-event-title">Название</label><input class="wl-input" id="wl-event-title" type="text" placeholder="Что запланировано?" required></div>
      <div class="wl-form-grid">
        <div class="wl-field"><label for="wl-event-date">Дата</label><input class="wl-input" id="wl-event-date" type="date" required></div>
        <div class="wl-field"><label for="wl-event-type">Тип</label><select class="wl-select" id="wl-event-type"><option value="meeting">Встреча</option><option value="task">Дедлайн задачи</option><option value="focus">Фокус-время</option><option value="personal">Личное</option></select></div>
      </div>
      <div class="wl-form-grid">
        <div class="wl-field"><label for="wl-event-start">Начало</label><input class="wl-input" id="wl-event-start" type="time" value="10:00"></div>
        <div class="wl-field"><label for="wl-event-end">Окончание</label><input class="wl-input" id="wl-event-end" type="time" value="11:00"></div>
      </div>
      <div class="wl-field"><label for="wl-event-description">Описание</label><textarea class="wl-textarea" id="wl-event-description" placeholder="Контекст, ссылка или место встречи"></textarea></div>
      <div class="wl-modal__footer"><button class="wl-button" id="wl-modal-cancel" type="button">Отмена</button><button class="wl-button wl-button--primary" type="submit">Создать событие</button></div>
    </form>
  </section>

  <div class="wl-drawer-backdrop" id="wl-drawer-backdrop"></div>
  <aside class="wl-drawer" id="wl-event-drawer" aria-label="Детали события">
    <header class="wl-drawer__head"><span class="wl-drawer__label" id="wl-drawer-label">Событие</span><button class="wl-icon-button" id="wl-drawer-close" type="button" aria-label="Закрыть"><svg class="wl-icon"><use href="#wl-i-x"></use></svg></button></header>
    <div class="wl-drawer__body" id="wl-drawer-body"></div>
  </aside>

  <div class="wl-toast" id="wl-toast" role="status"><svg class="wl-icon wl-icon--sm"><use href="#wl-i-check"></use></svg><span id="wl-toast-text">Готово</span></div>

  <script>
    (() => {
      const TODAY = new Date(2026, 6, 27);
      const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
      const monthGenitive = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
      const weekdayNames = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
      const weekdayShort = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
      const typeMeta = {
        meeting: { label: "Встреча", icon: "users", color: "var(--wl-blue)", bg: "var(--wl-blue-soft)" },
        task: { label: "Дедлайн", icon: "flag", color: "var(--wl-violet)", bg: "var(--wl-violet-soft)" },
        focus: { label: "Фокус-время", icon: "focus", color: "var(--wl-green)", bg: "var(--wl-green-soft)" },
        personal: { label: "Личное", icon: "personal", color: "var(--wl-amber)", bg: "var(--wl-amber-soft)" }
      };

      const events = [
        { id: 1, date: "2026-07-14", start: "17:00", end: "17:30", title: "Отправить отчёт за июнь", type: "task", project: "core", projectLabel: "Gavia Core", description: "Финальная проверка показателей и отправка отчёта команде.", location: "Задача WL-32", people: [] },
        { id: 2, date: "2026-07-16", start: "11:00", end: "12:30", title: "Ревью спринта 33", type: "meeting", project: "core", projectLabel: "Gavia Core", description: "Показать результаты спринта и собрать вопросы перед ретро.", location: "Переговорная 4", people: [["МК", "#8a5c9f", "Мария Ким"], ["ИП", "#16899b", "Иван Петров"]] },
        { id: 3, date: "2026-07-20", start: "", end: "", title: "Старт спринта 34", type: "task", project: "core", projectLabel: "Gavia Core", description: "Первый день нового спринта.", location: "Спринт 34", people: [] },
        { id: 4, date: "2026-07-22", start: "18:30", end: "19:30", title: "Стоматолог", type: "personal", project: "personal", projectLabel: "Личное", description: "Плановый приём.", location: "Клиника «Дента»", people: [] },
        { id: 5, date: "2026-07-24", start: "19:00", end: "22:00", title: "День рождения мамы", type: "personal", project: "personal", projectLabel: "Личное", description: "Ужин дома. Забрать подарок заранее.", location: "Дома", people: [] },
        { id: 6, date: "2026-07-27", start: "09:30", end: "10:00", title: "Дейли · Atlas 2.0", type: "meeting", project: "atlas", projectLabel: "Atlas 2.0", description: "Короткая синхронизация команды: прогресс, блокеры и план на день.", location: "Видеозвонок", people: [["МК", "#8a5c9f", "Мария Ким"], ["ИП", "#16899b", "Иван Петров"]] },
        { id: 7, date: "2026-07-27", start: "11:00", end: "12:00", title: "Ревью календарного прототипа", type: "meeting", project: "atlas", projectLabel: "Atlas 2.0", description: "Проверить режимы месяца и недели, фильтры и мобильный сценарий.", location: "Переговорная 2", people: [["АК", "#b17842", "Анна Котова"], ["ИП", "#16899b", "Иван Петров"]] },
        { id: 8, date: "2026-07-27", start: "14:00", end: "16:00", title: "Фокус · сценарии онбординга", type: "focus", project: "atlas", projectLabel: "Atlas 2.0", description: "Без встреч и уведомлений. Подготовить финальную последовательность экранов.", location: "Фокус-время", people: [] },
        { id: 9, date: "2026-07-27", start: "17:30", end: "18:00", title: "Согласовать тексты пустых состояний", type: "task", project: "atlas", projectLabel: "Atlas 2.0", description: "Закрыть замечания контент-команды по экранам задач и заметок.", location: "Задача WL-58", people: [] },
        { id: 10, date: "2026-07-28", start: "", end: "", title: "Старт исследования онбординга", type: "task", project: "atlas", projectLabel: "Atlas 2.0", description: "Начало серии пользовательских интервью.", location: "Эпик WL-41", people: [] },
        { id: 11, date: "2026-07-28", start: "10:00", end: "11:30", title: "Планирование спринта", type: "meeting", project: "core", projectLabel: "Gavia Core", description: "Сверить задачи и доступную ёмкость команды.", location: "Переговорная 1", people: [["МК", "#8a5c9f", "Мария Ким"], ["ДО", "#4d7aab", "Дмитрий Орлов"]] },
        { id: 12, date: "2026-07-28", start: "15:00", end: "16:00", title: "Интервью с пользователем · 01", type: "meeting", project: "atlas", projectLabel: "Atlas 2.0", description: "Проверка первого сценария онбординга.", location: "Видеозвонок", people: [["АК", "#b17842", "Анна Котова"]] },
        { id: 13, date: "2026-07-29", start: "12:00", end: "12:30", title: "1:1 с Марией", type: "meeting", project: "core", projectLabel: "Gavia Core", description: "Регулярная встреча один на один.", location: "Кофейная зона", people: [["МК", "#8a5c9f", "Мария Ким"]] },
        { id: 14, date: "2026-07-29", start: "14:00", end: "16:30", title: "Фокус · спецификация фильтров", type: "focus", project: "core", projectLabel: "Gavia Core", description: "Собрать контракт фильтров задач и заметок.", location: "Фокус-время", people: [] },
        { id: 15, date: "2026-07-30", start: "11:00", end: "12:00", title: "Ретро продуктовой команды", type: "meeting", project: "core", projectLabel: "Gavia Core", description: "Разобрать прошедший спринт и выбрать один процессный эксперимент.", location: "Переговорная 4", people: [["МК", "#8a5c9f", "Мария Ким"], ["ИП", "#16899b", "Иван Петров"]] },
        { id: 16, date: "2026-07-30", start: "14:00", end: "15:00", title: "Сверка продуктового roadmap", type: "meeting", project: "atlas", projectLabel: "Atlas 2.0", description: "Обновить зависимости и даты ключевых результатов.", location: "Видеозвонок", people: [["ДО", "#4d7aab", "Дмитрий Орлов"]] },
        { id: 17, date: "2026-07-31", start: "", end: "", title: "Релиз UI-kit 0.2.0", type: "task", project: "core", projectLabel: "Gavia Core", description: "Финальная ручная приёмка и публикация после подтверждения владельца.", location: "Релиз", people: [] },
        { id: 18, date: "2026-07-31", start: "16:00", end: "17:00", title: "Демо недели", type: "meeting", project: "core", projectLabel: "Gavia Core", description: "Короткие демо результатов всех направлений.", location: "Общий видеозвонок", people: [["МК", "#8a5c9f", "Мария Ким"], ["ИП", "#16899b", "Иван Петров"], ["АК", "#b17842", "Анна Котова"]] },
        { id: 19, date: "2026-08-01", start: "11:00", end: "13:00", title: "Бранч с друзьями", type: "personal", project: "personal", projectLabel: "Личное", description: "Столик у окна.", location: "Кафе «Соль»", people: [] },
        { id: 20, date: "2026-08-03", start: "10:00", end: "11:00", title: "Синк по результатам интервью", type: "meeting", project: "atlas", projectLabel: "Atlas 2.0", description: "Собрать наблюдения и определить следующие проверки.", location: "Видеозвонок", people: [["АК", "#b17842", "Анна Котова"]] }
      ];

      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
      let selectedDate = new Date(TODAY);
      let displayDate = new Date(TODAY);
      let activeView = "month";
      let activeEventId = null;
      let toastTimer;

      const icon = (name, size = "sm") => `<svg class="wl-icon wl-icon--${size}" aria-hidden="true"><use href="#wl-i-${name}"></use></svg>`;
      const iso = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      const fromIso = value => {
        const [year, month, day] = value.split("-").map(Number);
        return new Date(year, month - 1, day);
      };
      const sameDay = (first, second) => iso(first) === iso(second);
      const escapeHtml = value => value.replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[character]);
      const eventStyle = event => {
        const meta = typeMeta[event.type];
        return `--wl-event-color:${meta.color};--wl-event-bg:${meta.bg}`;
      };
      const formatDay = date => `${weekdayNames[date.getDay()]}, ${date.getDate()} ${monthGenitive[date.getMonth()]}`;
      const startOfWeek = date => {
        const result = new Date(date);
        const offset = (result.getDay() + 6) % 7;
        result.setDate(result.getDate() - offset);
        result.setHours(0, 0, 0, 0);
        return result;
      };
      const addDays = (date, amount) => {
        const result = new Date(date);
        result.setDate(result.getDate() + amount);
        return result;
      };

      function enabledValues(attribute) {
        return $$(`input[${attribute}]`).filter(input => input.checked).map(input => input.getAttribute(attribute));
      }

      function filteredEvents() {
        const types = enabledValues("data-filter-type");
        const projects = enabledValues("data-filter-project");
        return events.filter(event => types.includes(event.type) && projects.includes(event.project));
      }

      function eventsForDate(date) {
        const key = typeof date === "string" ? date : iso(date);
        return filteredEvents().filter(event => event.date === key).sort((first, second) => (first.start || "00:00").localeCompare(second.start || "00:00"));
      }

      function renderPeriodLabel() {
        if (activeView === "month") {
          $("#wl-period-label").textContent = `${monthNames[displayDate.getMonth()]} ${displayDate.getFullYear()}`;
        } else if (activeView === "week") {
          const start = startOfWeek(displayDate);
          const end = addDays(start, 6);
          $("#wl-period-label").textContent = start.getMonth() === end.getMonth()
            ? `${start.getDate()}–${end.getDate()} ${monthGenitive[start.getMonth()]}`
            : `${start.getDate()} ${monthGenitive[start.getMonth()]} – ${end.getDate()} ${monthGenitive[end.getMonth()]}`;
        } else {
          $("#wl-period-label").textContent = `${monthNames[displayDate.getMonth()]} ${displayDate.getFullYear()}`;
        }
      }

      function renderMonth() {
        const first = new Date(displayDate.getFullYear(), displayDate.getMonth(), 1);
        const offset = (first.getDay() + 6) % 7;
        const gridStart = addDays(first, -offset);
        const weekdays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].map(day => `<div class="wl-month-weekday">${day}</div>`).join("");
        const days = Array.from({ length: 42 }, (_, index) => {
          const date = addDays(gridStart, index);
          const dayEvents = eventsForDate(date);
          const visibleEvents = dayEvents.slice(0, 3);
          return `
            <button class="wl-month-day" type="button" style="border:0" data-date="${iso(date)}" data-selected="${sameDay(date, selectedDate)}" data-today="${sameDay(date, TODAY)}" data-outside="${date.getMonth() !== displayDate.getMonth()}" aria-label="${formatDay(date)}, ${dayEvents.length} событий">
              <span class="wl-month-day__number">${date.getDate()}</span>
              <span class="wl-month-events">
                ${visibleEvents.map(event => `<span class="wl-month-event" data-event-id="${event.id}" style="${eventStyle(event)}"><span class="wl-month-event__time">${event.start || "весь день"}</span><span class="wl-month-event__title">${event.title}</span></span>`).join("")}
                ${dayEvents.length > 3 ? `<span class="wl-month-more">ещё ${dayEvents.length - 3}</span>` : ""}
              </span>
            </button>`;
        }).join("");
        $("#wl-view-month").innerHTML = `<div class="wl-month-grid">${weekdays}${days}</div>`;
        $$(".wl-month-day").forEach(day => day.addEventListener("click", event => {
          selectedDate = fromIso(day.dataset.date);
          const eventTarget = event.target.closest("[data-event-id]");
          if (eventTarget) {
            openEvent(Number(eventTarget.dataset.eventId));
          } else if (matchMedia("(max-width: 1020px)").matches) {
            openDayDrawer(selectedDate);
          }
          renderMonth();
          renderAgenda();
        }));
      }

      function renderWeek() {
        const start = startOfWeek(displayDate);
        const days = Array.from({ length: 7 }, (_, index) => addDays(start, index));
        const hours = Array.from({ length: 13 }, (_, index) => index + 8);
        let html = `<div class="wl-week-grid"><div class="wl-week-corner"></div>`;
        html += days.map(date => `<button class="wl-week-head" type="button" data-date="${iso(date)}" data-today="${sameDay(date, TODAY)}"><span class="wl-week-head__day">${weekdayShort[date.getDay()]}</span><span class="wl-week-head__date">${date.getDate()}</span></button>`).join("");
        hours.forEach(hour => {
          html += `<div class="wl-week-time">${String(hour).padStart(2, "0")}:00</div>`;
          days.forEach(date => {
            const cellEvents = eventsForDate(date).filter(event => event.start && Number(event.start.slice(0, 2)) === hour);
            html += `<div class="wl-week-cell" data-date="${iso(date)}" data-hour="${hour}">${cellEvents.map((event, index) => {
              const startMinutes = Number(event.start.slice(3));
              const endHour = Number(event.end.slice(0, 2));
              const endMinutes = Number(event.end.slice(3));
              const duration = Math.max(30, (endHour * 60 + endMinutes) - (hour * 60 + startMinutes));
              const top = Math.round(startMinutes / 60 * 64) + 2;
              const height = Math.max(30, Math.round(duration / 60 * 64) - 4);
              return `<button class="wl-week-event" type="button" data-event-id="${event.id}" style="${eventStyle(event)};top:${top}px;height:${height}px;left:${4 + index * 4}px;right:${4 + index * 2}px"><strong>${event.title}</strong><span>${event.start}–${event.end}</span></button>`;
            }).join("")}</div>`;
          });
        });
        html += `</div>`;
        $("#wl-view-week").innerHTML = html;
        $$(".wl-week-head").forEach(day => day.addEventListener("click", () => {
          selectedDate = fromIso(day.dataset.date);
          renderAgenda();
        }));
        $$(".wl-week-cell").forEach(cell => cell.addEventListener("dblclick", () => openCreateModal(cell.dataset.date, `${String(cell.dataset.hour).padStart(2, "0")}:00`)));
        $$(".wl-week-event").forEach(event => event.addEventListener("click", () => openEvent(Number(event.dataset.eventId))));
      }

      function renderSchedule() {
        const visible = filteredEvents()
          .filter(event => {
            const date = fromIso(event.date);
            return date.getFullYear() === displayDate.getFullYear() && date.getMonth() === displayDate.getMonth();
          })
          .sort((first, second) => `${first.date} ${first.start || "00:00"}`.localeCompare(`${second.date} ${second.start || "00:00"}`));
        const groups = Object.groupBy ? Object.groupBy(visible, event => event.date) : visible.reduce((result, event) => {
          (result[event.date] ||= []).push(event);
          return result;
        }, {});
        $("#wl-view-schedule").innerHTML = Object.entries(groups).map(([dateKey, dayEvents]) => {
          const date = fromIso(dateKey);
          return `<section class="wl-schedule-day"><div class="wl-schedule-date" data-today="${sameDay(date, TODAY)}"><strong>${sameDay(date, TODAY) ? "Сегодня" : weekdayNames[date.getDay()]}</strong><span>${date.getDate()} ${monthGenitive[date.getMonth()]}</span></div><div class="wl-schedule-events">${dayEvents.map(event => {
            const meta = typeMeta[event.type];
            return `<button class="wl-schedule-event" type="button" data-event-id="${event.id}" style="${eventStyle(event)}"><span class="wl-schedule-event__time">${event.start || "весь день"}</span><span class="wl-event-icon">${icon(meta.icon, "sm")}</span><span class="wl-schedule-event__copy"><span class="wl-schedule-event__title">${event.title}</span><span class="wl-schedule-event__meta">${event.end ? `до ${event.end} · ` : ""}${event.location}</span></span><span class="wl-schedule-event__project">${event.projectLabel}</span></button>`;
          }).join("")}</div></section>`;
        }).join("") || `<div class="wl-agenda-empty"><div><span class="wl-agenda-empty__icon">${icon("calendar", "sm")}</span><h2 class="wl-agenda-empty__title">В этом месяце событий нет</h2><p class="wl-agenda-empty__copy">Проверьте фильтры или создайте новое событие.</p></div></div>`;
        $$(".wl-schedule-event").forEach(event => event.addEventListener("click", () => openEvent(Number(event.dataset.eventId))));
      }

      function renderAgenda() {
        const dayEvents = eventsForDate(selectedDate);
        $("#wl-agenda-date").textContent = formatDay(selectedDate);
        const latestEnd = dayEvents.filter(event => event.end).at(-1)?.end;
        $("#wl-agenda-summary").textContent = dayEvents.length
          ? `${dayEvents.length} ${pluralize(dayEvents.length, "событие", "события", "событий")}${latestEnd ? ` · свободно после ${latestEnd}` : ""}`
          : "свободный день";
        $("#wl-agenda-body").innerHTML = dayEvents.length ? dayEvents.map(event => {
          const meta = typeMeta[event.type];
          return `<button class="wl-agenda-event" type="button" data-event-id="${event.id}" style="${eventStyle(event)}"><span class="wl-agenda-event__time">${event.start || "весь день"}</span><span class="wl-agenda-event__dot"></span><span><span class="wl-agenda-event__title" style="display:block">${event.title}</span><span class="wl-agenda-event__meta" style="display:block">${meta.label} · ${event.location}</span>${event.people.length ? `<span class="wl-agenda-event__people">${event.people.slice(0, 3).map(person => `<span class="wl-avatar wl-avatar--sm" style="--wl-avatar-color:${person[1]}" title="${person[2]}">${person[0]}</span>`).join("")}</span>` : ""}</span></button>`;
        }).join("") : `<div class="wl-agenda-empty"><div><span class="wl-agenda-empty__icon">${icon("calendar", "sm")}</span><h3 class="wl-agenda-empty__title">День свободен</h3><p class="wl-agenda-empty__copy">Можно запланировать фокус-время или новое событие.</p><button class="wl-button" id="wl-agenda-add" type="button" style="margin-top:14px">${icon("plus", "sm")}Добавить</button></div></div>`;
        $$(".wl-agenda-event").forEach(event => event.addEventListener("click", () => openEvent(Number(event.dataset.eventId))));
        $("#wl-agenda-add")?.addEventListener("click", () => openCreateModal(iso(selectedDate)));
      }

      function pluralize(number, one, few, many) {
        const mod10 = number % 10;
        const mod100 = number % 100;
        if (mod10 === 1 && mod100 !== 11) return one;
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
        return many;
      }

      function renderAll() {
        renderPeriodLabel();
        renderMonth();
        renderWeek();
        renderSchedule();
        renderAgenda();
      }

      function setView(view) {
        activeView = view;
        $$(".wl-segmented__item").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.view === view)));
        $$(".wl-view").forEach(panel => panel.classList.remove("wl-view--active"));
        $(`#wl-view-${view}`).classList.add("wl-view--active");
        renderPeriodLabel();
        if (view === "week") {
          renderWeek();
          setTimeout(() => { $("#wl-view-week").scrollTop = 64; }, 0);
        }
        if (view === "schedule") renderSchedule();
      }

      function shiftPeriod(direction) {
        if (activeView === "week") displayDate = addDays(displayDate, direction * 7);
        else displayDate = new Date(displayDate.getFullYear(), displayDate.getMonth() + direction, 1);
        if (activeView === "month") renderMonth();
        if (activeView === "week") renderWeek();
        if (activeView === "schedule") renderSchedule();
        renderPeriodLabel();
      }

      function positionFilter() {
        const buttonRect = $("#wl-filter-button").getBoundingClientRect();
        const popover = $("#wl-filter-popover");
        const width = 300;
        popover.style.top = `${buttonRect.bottom + 8}px`;
        popover.style.left = `${Math.max(12, Math.min(window.innerWidth - width - 12, buttonRect.right - width))}px`;
      }

      function updateFilters() {
        const unchecked = $$("#wl-filter-popover input").filter(input => !input.checked).length;
        $("#wl-filter-count").textContent = unchecked;
        $("#wl-filter-count").classList.toggle("wl-filter-count--visible", unchecked > 0);
        $("#wl-filter-button").dataset.active = String(unchecked > 0);
        renderAll();
      }

      function openCreateModal(dateValue = iso(selectedDate), start = "10:00") {
        $("#wl-event-date").value = dateValue;
        $("#wl-event-start").value = start;
        const [hour, minutes] = start.split(":").map(Number);
        $("#wl-event-end").value = `${String(Math.min(23, hour + 1)).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
        $("#wl-event-modal").classList.add("wl-modal--visible");
        $("#wl-modal-backdrop").classList.add("wl-modal-backdrop--visible");
        setTimeout(() => $("#wl-event-title").focus(), 30);
      }

      function closeModal() {
        $("#wl-event-modal").classList.remove("wl-modal--visible");
        $("#wl-modal-backdrop").classList.remove("wl-modal-backdrop--visible");
      }

      function openEvent(eventId) {
        const event = events.find(item => item.id === eventId);
        if (!event) return;
        activeEventId = eventId;
        const meta = typeMeta[event.type];
        const eventDate = fromIso(event.date);
        $("#wl-drawer-label").textContent = "Событие";
        $("#wl-drawer-body").innerHTML = `
          <span class="wl-drawer__type" style="${eventStyle(event)}">${icon(meta.icon, "sm")}${meta.label}</span>
          <h2 class="wl-drawer__title">${event.title}</h2>
          <div class="wl-drawer__time">${icon("clock", "sm")}<span><strong>${formatDay(eventDate)}</strong><br>${event.start ? `${event.start}–${event.end}` : "Весь день"}</span></div>
          <div class="wl-drawer__time">${icon(event.location === "Видеозвонок" || event.location === "Общий видеозвонок" ? "video" : "location", "sm")}<span>${event.location}</span></div>
          <p class="wl-drawer__description">${event.description}</p>
          ${event.people.length ? `<section class="wl-drawer__section"><h3 class="wl-drawer__section-title">Участники · ${event.people.length + 1}</h3><div class="wl-attendees"><div class="wl-attendee"><span class="wl-avatar wl-avatar--sm" style="--wl-avatar-color:#4f6f93">ЕА</span><span>Елена Алексеева · организатор</span></div>${event.people.map(person => `<div class="wl-attendee"><span class="wl-avatar wl-avatar--sm" style="--wl-avatar-color:${person[1]}">${person[0]}</span><span>${person[2]}</span></div>`).join("")}</div></section>` : ""}
          <div class="wl-drawer__actions"><button class="wl-button wl-button--primary" type="button">${icon("check", "sm")}Принять</button><button class="wl-button" type="button">${icon("edit", "sm")}Изменить</button></div>`;
        $("#wl-event-drawer").classList.add("wl-drawer--visible");
        $("#wl-drawer-backdrop").classList.add("wl-drawer-backdrop--visible");
      }

      function openDayDrawer(date) {
        const dayEvents = eventsForDate(date);
        $("#wl-drawer-label").textContent = "Расписание дня";
        $("#wl-drawer-body").innerHTML = `
          <div class="wl-drawer__type" style="--wl-event-color:var(--wl-blue);--wl-event-bg:var(--wl-blue-soft)">${icon("calendar", "sm")}${dayEvents.length} ${pluralize(dayEvents.length, "событие", "события", "событий")}</div>
          <h2 class="wl-drawer__title">${formatDay(date)}</h2>
          <div class="wl-drawer__section">
            ${dayEvents.length ? dayEvents.map(event => {
              const meta = typeMeta[event.type];
              return `<button class="wl-agenda-event" type="button" data-day-event-id="${event.id}" style="${eventStyle(event)}"><span class="wl-agenda-event__time">${event.start || "весь день"}</span><span class="wl-agenda-event__dot"></span><span><span class="wl-agenda-event__title">${event.title}</span><span class="wl-agenda-event__meta">${meta.label} · ${event.location}</span></span></button>`;
            }).join("") : `<div class="wl-agenda-empty" style="min-height:180px"><div><span class="wl-agenda-empty__icon">${icon("calendar", "sm")}</span><h3 class="wl-agenda-empty__title">День свободен</h3><p class="wl-agenda-empty__copy">Добавьте встречу или забронируйте фокус-время.</p></div></div>`}
          </div>
          <div class="wl-drawer__actions"><button class="wl-button wl-button--primary" id="wl-drawer-add-event" type="button">${icon("plus", "sm")}Добавить событие</button></div>`;
        $$("[data-day-event-id]").forEach(button => button.addEventListener("click", () => openEvent(Number(button.dataset.dayEventId))));
        $("#wl-drawer-add-event").addEventListener("click", () => {
          closeDrawer();
          openCreateModal(iso(date));
        });
        $("#wl-event-drawer").classList.add("wl-drawer--visible");
        $("#wl-drawer-backdrop").classList.add("wl-drawer-backdrop--visible");
      }

      function closeDrawer() {
        $("#wl-event-drawer").classList.remove("wl-drawer--visible");
        $("#wl-drawer-backdrop").classList.remove("wl-drawer-backdrop--visible");
        activeEventId = null;
      }

      function showToast(text) {
        clearTimeout(toastTimer);
        $("#wl-toast-text").textContent = text;
        $("#wl-toast").classList.add("wl-toast--visible");
        toastTimer = setTimeout(() => $("#wl-toast").classList.remove("wl-toast--visible"), 2100);
      }

      $$(".wl-segmented__item").forEach(button => button.addEventListener("click", () => setView(button.dataset.view)));
      $("#wl-period-prev").addEventListener("click", () => shiftPeriod(-1));
      $("#wl-period-next").addEventListener("click", () => shiftPeriod(1));
      $("#wl-today").addEventListener("click", () => {
        selectedDate = new Date(TODAY);
        displayDate = new Date(TODAY);
        renderAll();
        showToast("Показана сегодняшняя дата");
      });

      $("#wl-filter-button").addEventListener("click", event => {
        const popover = $("#wl-filter-popover");
        const visible = popover.classList.toggle("wl-filter-popover--visible");
        event.currentTarget.setAttribute("aria-expanded", String(visible));
        if (visible) positionFilter();
      });
      $$("#wl-filter-popover input").forEach(input => input.addEventListener("change", updateFilters));
      $("#wl-filter-reset").addEventListener("click", () => {
        $$("#wl-filter-popover input").forEach(input => { input.checked = true; });
        updateFilters();
      });
      document.addEventListener("click", event => {
        if (!event.target.closest("#wl-filter-popover") && !event.target.closest("#wl-filter-button")) {
          $("#wl-filter-popover").classList.remove("wl-filter-popover--visible");
          $("#wl-filter-button").setAttribute("aria-expanded", "false");
        }
      });

      $("#wl-new-event").addEventListener("click", () => openCreateModal());
      $("#wl-modal-close").addEventListener("click", closeModal);
      $("#wl-modal-cancel").addEventListener("click", closeModal);
      $("#wl-modal-backdrop").addEventListener("click", closeModal);
      $("#wl-event-form").addEventListener("submit", event => {
        event.preventDefault();
        const title = $("#wl-event-title").value.trim();
        if (!title) return;
        const type = $("#wl-event-type").value;
        const project = type === "personal" ? "personal" : "core";
        const created = {
          id: Math.max(...events.map(item => item.id)) + 1,
          date: $("#wl-event-date").value,
          start: $("#wl-event-start").value,
          end: $("#wl-event-end").value,
          title: escapeHtml(title),
          type,
          project,
          projectLabel: project === "personal" ? "Личное" : "Gavia Core",
          description: escapeHtml($("#wl-event-description").value.trim() || "Описание пока не добавлено."),
          location: type === "meeting" ? "Видеозвонок" : typeMeta[type].label,
          people: []
        };
        events.push(created);
        selectedDate = fromIso(created.date);
        displayDate = new Date(selectedDate);
        event.currentTarget.reset();
        $("#wl-event-start").value = "10:00";
        $("#wl-event-end").value = "11:00";
        closeModal();
        renderAll();
        openEvent(created.id);
        showToast("Событие создано");
      });

      $("#wl-drawer-close").addEventListener("click", closeDrawer);
      $("#wl-drawer-backdrop").addEventListener("click", closeDrawer);
      $("#wl-mobile-menu").addEventListener("click", () => {
        $("#wl-sidebar").classList.add("wl-sidebar--visible");
        $("#wl-sidebar-backdrop").classList.add("wl-sidebar-backdrop--visible");
      });
      $("#wl-sidebar-backdrop").addEventListener("click", () => {
        $("#wl-sidebar").classList.remove("wl-sidebar--visible");
        $("#wl-sidebar-backdrop").classList.remove("wl-sidebar-backdrop--visible");
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeModal();
          closeDrawer();
          $("#wl-filter-popover").classList.remove("wl-filter-popover--visible");
        }
        if (event.key === "n" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
          event.preventDefault();
          openCreateModal();
        }
      });
      window.addEventListener("resize", () => {
        if ($("#wl-filter-popover").classList.contains("wl-filter-popover--visible")) positionFilter();
      });

      renderAll();
    })();
  </script>
</body>
</html>
