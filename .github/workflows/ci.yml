name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: gavia-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 15
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22.13.0
          - "24"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          build: "true"
      - name: Verify backward compatibility
        run: pnpm verify:compatibility
      - name: Verify reviewed bundle budgets
        if: matrix.node-version == '24'
        run: pnpm size
      - name: Verify source API metadata
        run: pnpm api:check
      - name: Verify release tooling
        run: pnpm test:release-tools
      - name: Verify quality report generation
        run: pnpm test:quality-report
      - name: Verify compatibility checker catches breaking changes
        if: matrix.node-version == 24
        run: node --test scripts/check-compatibility.test.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint source and tooling
        run: pnpm lint
      - name: Test component generator and package tooling
        run: node --test scripts/new-component.test.mjs scripts/package-docs.test.mjs scripts/normalize-declarations.test.mjs scripts/archive-fonts.test.mjs scripts/size-budget.test.mjs scripts/check-package-types.test.mjs scripts/sync-api.test.mjs scripts/utility-boundary.test.mjs scripts/prerender-pages.test.mjs .github/scripts/pages-provenance.test.mjs
      - name: Test Playground on coverage runtime
        if: matrix.node-version == '24'
        run: pnpm --filter gavia-ui-playground test
      - name: Verify dependency boundary
        run: pnpm verify:dependencies
      - name: Verify icon registry
        run: pnpm icons:check
      - name: Verify design tokens and theme contrast
        run: pnpm tokens:check
      - name: Verify responsive artwork provenance
        run: node apps/playground/scripts/brand-images.mjs --check
      - name: Test
        if: matrix.node-version == '22.13.0'
        run: pnpm test
      - name: Test with coverage thresholds
        if: matrix.node-version == 24
        run: pnpm test:coverage
      - name: Generate measured playground quality data
        if: matrix.node-version == 24
        run: pnpm quality:update
      - name: Save measured playground quality data
        if: matrix.node-version == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gavia-ui-quality
          path: apps/playground/src/project/quality-report.generated.json
          if-no-files-found: error
      - name: Save coverage report
        if: always() && matrix.node-version == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gavia-ui-coverage
          path: packages/ui-kit/coverage/
          if-no-files-found: ignore
      - name: Build playground
        run: pnpm build:playground
      - name: Pack library
        id: package
        run: |
          pnpm run pack
          node -e "const p=require('./packages/ui-kit/package.json'); console.log('archive=gavia-ui-'+p.version+'.tgz')" >> "$GITHUB_OUTPUT"
      - name: Verify package contents
        run: |
          if tar -tf "packages/ui-kit/${{ steps.package.outputs.archive }}" | grep -E '(^|/)(node_modules|vue|primevue|primeicons)(/|$)'; then
            echo "Package must not contain bundled peer dependencies."
            exit 1
          fi
      - name: Verify packed package in consumer app
        run: pnpm verify:package --archive "packages/ui-kit/${{ steps.package.outputs.archive }}"
      - name: Lint exact package metadata and ESM declarations
        run: |-
          pnpm exec publint --strict "packages/ui-kit/${{ steps.package.outputs.archive }}"
          pnpm verify:types "packages/ui-kit/${{ steps.package.outputs.archive }}"
      - name: Save verified candidate archive
        if: matrix.node-version == '24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gavia-ui-candidate-package
          path: packages/ui-kit/${{ steps.package.outputs.archive }}
          if-no-files-found: error
  browser:
    timeout-minutes: 20
    name: Browser regression tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: mobile-chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          node-version: "24"
          build: "true"
      - name: Build production interaction fixture
        env:
          GAVIA_E2E_BUILD: "1"
        run: pnpm build:playground
      - name: Set up cached browser
        uses: ./.github/actions/playwright
        with:
          browser: ${{ matrix.engine }}
      - name: Verify packed browser consumer and hydration
        if: matrix.project == 'chromium'
        run: pnpm verify:package:browser
      - name: Run browser tests
        run: pnpm test:e2e --project="${{ matrix.project }}"
      - name: Verify prerendered Pages and cold loading budgets
        if: matrix.project == 'chromium'
        run: |
          pnpm build:pages
          pnpm pages:prerender
          pnpm test:pages
      - name: Save theme screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gavia-ui-browser-results-${{ matrix.project }}
          path: |
            apps/playground/test-results/
            .tmp/package-verification/pnpm-vue-3.4.38-browser.json
          include-hidden-files: true
          if-no-files-found: ignore
  visual:
    timeout-minutes: 15
    name: Reviewed visual regression (desktop/mobile, five themes)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          node-version: "24"
          build: "true"
      - name: Build production interaction fixture
        env:
          GAVIA_E2E_BUILD: "1"
        run: pnpm build:playground
      - name: Set up cached browser
        uses: ./.github/actions/playwright
        with:
          browser: chromium
      - name: Compare reviewed screenshots
        run: pnpm test:visual
      - name: Save expected, actual, diff images and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gavia-ui-visual-results
          path: apps/playground/test-results/
          if-no-files-found: ignore
  visual-linux:
    name: Supplemental Linux visuals
    uses: ./.github/workflows/visual-linux.yml
  consumer:
    timeout-minutes: 15
    name: Packed consumer (${{ matrix.manager }}, Vue ${{ matrix.vue }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager: npm
            vue: 3.4.0
          - manager: bun
            vue: 3.5.40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          node-version: "24"
          build: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.manager == 'bun'
        with:
          bun-version: 1.4.0
      - name: Set up cached browser
        uses: ./.github/actions/playwright
        with:
          browser: chromium
      - name: Verify minimum Vue and TypeScript with npm
        if: matrix.manager == 'npm'
        run: pnpm verify:package:browser --manager npm --vue 3.4.0 --typescript 5.4.5
      - name: Verify Bun consumer
        if: matrix.manager == 'bun'
        run: pnpm verify:package:browser --manager bun --vue 3.5.40
      - name: Save consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gavia-ui-consumer-${{ matrix.manager }}
          path: .tmp/package-verification/
          include-hidden-files: true
          if-no-files-found: ignore
    needs:
      - verify
