name: publish

# Gavia UI: checks on main/PR; public npm publication only from a new version tag.
# First npm publication and trusted-publisher setup: docs/releases.md.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playground imports the public package types; a fresh checkout has no dist.
      - name: Build library
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify dependency boundary
        run: pnpm verify:dependencies

      - name: Verify icon registry
        run: pnpm icons:check

      - name: Verify design tokens and theme contrast
        run: pnpm tokens:check

      - name: Test
        run: pnpm test

      - name: Build playground
        run: pnpm build:playground

      - name: Pack library
        run: pnpm run pack

      - name: Verify package contents
        run: |
          if tar -tf packages/ui-kit/gavia-ui-*.tgz | grep -E '(^|/)(node_modules|vue|primevue|primeicons)(/|$)'; then
            echo "Package must not contain bundled peer dependencies."
            exit 1
          fi

      - name: Verify packed package in consumer app
        run: pnpm verify:package

  browser:
    name: Browser regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library CSS and public API
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Save theme screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-browser-results
          path: apps/playground/test-results/
          if-no-files-found: ignore

  visual:
    name: Reviewed visual regression (desktop/mobile, three themes)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library CSS and public API
        run: pnpm build
      - name: Install pinned Chromium
        run: pnpm exec playwright install chromium
      - name: Compare reviewed screenshots
        run: pnpm test:visual
      - name: Save expected, actual, diff images and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-visual-results
          path: apps/playground/test-results/
          if-no-files-found: ignore

  publish:
    needs: [verify, browser, visual]
    if: github.ref_type == 'tag' && github.repository == 'whitewolf06/gavia-ui'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Check release tag
        run: node -e "const p=require('./packages/ui-kit/package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Tag and package version differ');"

      - name: Pack checked library
        run: pnpm run pack

      # npm CLI is used only for OIDC publication, never for dependency installation.
      - name: Publish checked archive to public npm
        working-directory: packages/ui-kit
        run: npm publish ./gavia-ui-*.tgz --access public --provenance
