name: publish

# Gavia UI: checks on main/PR; public npm publication only from a new version tag.
# First npm publication and trusted-publisher setup: docs/releases.md.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playground imports the public package types; a fresh checkout has no dist.
      - name: Build library
        run: pnpm build

      - name: Verify backward compatibility
        run: pnpm verify:compatibility

      - name: Verify release tooling
        run: pnpm test:release-tools

      - name: Verify quality report generation
        run: pnpm test:quality-report

      - name: Verify compatibility checker catches breaking changes
        if: matrix.node-version == 24
        run: node --test scripts/check-compatibility.test.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify dependency boundary
        run: pnpm verify:dependencies

      - name: Verify icon registry
        run: pnpm icons:check

      - name: Verify design tokens and theme contrast
        run: pnpm tokens:check

      - name: Test
        if: matrix.node-version == 18
        run: pnpm test

      - name: Test with coverage thresholds
        if: matrix.node-version == 24
        run: pnpm test:coverage

      - name: Generate measured playground quality data
        if: matrix.node-version == 24
        run: pnpm quality:update

      # Only numeric metrics, synthetic test totals, timestamp and Git revision.
      - name: Save measured playground quality data
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-quality
          path: apps/playground/src/project/quality-report.generated.json
          if-no-files-found: error

      - name: Save coverage report
        if: always() && matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-coverage
          path: packages/ui-kit/coverage/
          if-no-files-found: ignore

      - name: Build playground
        run: pnpm build:playground

      - name: Pack library
        id: package
        run: |
          pnpm run pack
          node -e "const p=require('./packages/ui-kit/package.json'); console.log('archive=gavia-ui-'+p.version+'.tgz')" >> "$GITHUB_OUTPUT"

      - name: Verify package contents
        run: |
          if tar -tf "packages/ui-kit/${{ steps.package.outputs.archive }}" | grep -E '(^|/)(node_modules|vue|primevue|primeicons)(/|$)'; then
            echo "Package must not contain bundled peer dependencies."
            exit 1
          fi

      - name: Verify packed package in consumer app
        run: pnpm verify:package --archive "packages/ui-kit/${{ steps.package.outputs.archive }}"

  browser:
    timeout-minutes: 20
    name: Browser regression tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: mobile-chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library CSS and public API
        run: pnpm build

      - name: Prefer Ubuntu archive for browser dependencies
        run: bash .github/scripts/prepare-browser-dependencies.sh

      - name: Install Playwright browsers
        timeout-minutes: 6
        run: pnpm exec playwright install --with-deps "${{ matrix.engine }}"

      - name: Verify packed browser consumer and hydration
        if: matrix.project == 'chromium'
        run: pnpm verify:package:browser

      - name: Run browser tests
        run: pnpm test:e2e --project="${{ matrix.project }}"

      - name: Save theme screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-browser-results-${{ matrix.project }}
          path: |
            apps/playground/test-results/
            .tmp/package-verification/pnpm-vue-3.4.38-browser.json
          if-no-files-found: ignore

  visual:
    timeout-minutes: 15
    name: Reviewed visual regression (desktop/mobile, four themes)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library CSS and public API
        run: pnpm build
      - name: Install pinned Chromium
        run: pnpm exec playwright install chromium
      - name: Compare reviewed screenshots
        run: pnpm test:visual
      - name: Save expected, actual, diff images and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-visual-results
          path: apps/playground/test-results/
          if-no-files-found: ignore

  pages:
    timeout-minutes: 20
    name: Publish documentation to GitHub Pages
    needs: [verify, browser, visual, consumer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'whitewolf06/gavia-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: gavia-ui-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library CSS and public API
        run: pnpm build
      - name: Download quality metrics measured in this workflow
        uses: actions/download-artifact@v4
        with:
          name: gavia-ui-quality
          path: .tmp/quality-report
      - name: Restore validated quality metrics for this revision
        run: pnpm quality:restore .tmp/quality-report
      - name: Build public documentation for its repository path
        run: pnpm build:pages
      - name: Prefer Ubuntu archive for browser dependencies
        run: bash .github/scripts/prepare-browser-dependencies.sh

      - name: Install pinned Chromium
        timeout-minutes: 6
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production Pages build
        run: pnpm test:pages
      - name: Save Pages smoke traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-pages-results
          path: apps/playground/test-results/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/playground/dist
      - name: Require the current main commit
        shell: bash
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$latest" = "$GITHUB_SHA"
      - uses: actions/deploy-pages@v5
        id: deployment

  publish:
    timeout-minutes: 20
    needs: [verify, browser, visual, consumer]
    # Bootstrap 0.7.0 is published manually; its new tag records history only.
    # See docs/releases.md for the first release and trusted-publisher setup.
    if: github.ref_type == 'tag' && github.repository == 'whitewolf06/gavia-ui' && github.ref_name != 'v0.7.0'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Check release tag and select npm channel
        id: channel
        shell: bash
        run: |
          tag="$(node scripts/release-channel.mjs)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check reviewed release notes and migration
        run: node scripts/release-notes.mjs --check

      - name: Pack checked library
        id: package
        run: |
          pnpm run pack
          node -e "const fs=require('node:fs'), crypto=require('node:crypto'); const p=require('./packages/ui-kit/package.json'); const archive='gavia-ui-'+p.version+'.tgz'; const bytes=fs.readFileSync('packages/ui-kit/'+archive); console.log('archive='+archive); console.log('version='+p.version); console.log('integrity=sha512-'+crypto.createHash('sha512').update(bytes).digest('base64'));" >> "$GITHUB_OUTPUT"

      - name: Prefer Ubuntu archive for browser dependencies
        run: bash .github/scripts/prepare-browser-dependencies.sh

      - name: Install Chromium for exact archive verification
        timeout-minutes: 6
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify exact release archive in consumer app
        run: pnpm verify:package:browser --archive "packages/ui-kit/${{ steps.package.outputs.archive }}"

      # This allowlisted report contains only synthetic fixture IDs, versions,
      # archive hashes, bundle sizes and successful boolean checks; no HTML/logs.
      - name: Save exact release consumer summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-release-consumer
          path: .tmp/package-verification/pnpm-vue-3.4.38-browser.json
          if-no-files-found: ignore

      - name: Record checked release integrity
        run: echo "Checked release archive integrity ${{ steps.package.outputs.integrity }}"

      - name: Save checked release archive
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-release-${{ steps.package.outputs.version }}
          path: packages/ui-kit/${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      # npm CLI is used only for OIDC publication, never for dependency installation.
      - name: Publish checked archive to public npm
        working-directory: packages/ui-kit
        run: npm publish "./${{ steps.package.outputs.archive }}" --access public --provenance --tag "${{ steps.channel.outputs.tag }}"

  consumer:
    timeout-minutes: 15
    name: Packed consumer (${{ matrix.manager }}, Vue ${{ matrix.vue }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager: npm
            vue: "3.4.0"
          - manager: bun
            vue: "3.5.40"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: matrix.manager == 'bun'
        with:
          bun-version: "1.4.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prefer Ubuntu archive for browser dependencies
        run: bash .github/scripts/prepare-browser-dependencies.sh
      - name: Install pinned Chromium
        timeout-minutes: 6
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify minimum Vue with npm
        if: matrix.manager == 'npm'
        run: pnpm verify:package:browser --manager npm --vue 3.4.0
      - name: Verify Bun consumer
        if: matrix.manager == 'bun'
        run: pnpm verify:package:browser --manager bun --vue 3.5.40
      - name: Save consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-consumer-${{ matrix.manager }}
          path: .tmp/package-verification/
          if-no-files-found: ignore

  release-preview:
    timeout-minutes: 10
    name: Archive versioned playground
    needs: [publish]
    if: github.ref_type == 'tag' && github.repository == 'whitewolf06/gavia-ui' && github.ref_name != 'v0.7.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Download quality metrics measured in this workflow
        uses: actions/download-artifact@v4
        with:
          name: gavia-ui-quality
          path: .tmp/quality-report
      - name: Restore validated quality metrics for this revision
        run: pnpm quality:restore .tmp/quality-report
      - name: Build portable release playground
        run: pnpm --filter gavia-ui-playground build --base=./
      - run: pnpm release:preview
      - uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-playground-${{ github.ref_name }}
          path: .tmp/release-previews/
          if-no-files-found: error
          retention-days: 90
      - name: Attach preview to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs > .tmp/release-notes.md
          channel="$(node scripts/release-channel.mjs)"
          prerelease=()
          if [ "$channel" = "next" ]; then prerelease=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Gavia UI $RELEASE_TAG" --notes-file .tmp/release-notes.md "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" .tmp/release-previews/* --clobber
