name: publish

# Публикация @whitelife-core/ui-kit в GitHub Packages по тегу v*.
# Релизный цикл:
#   1. поднять version в packages/ui-kit/package.json и закоммитить
#   2. git tag v<version> && git push origin main --tags
#   3. Action соберёт, протестирует и опубликует пакет (приватно,
#      видимость наследуется от репозитория)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@whitelife-core"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify dependency boundary
        run: pnpm verify:dependencies

      - name: Verify icon registry
        run: pnpm icons:check

      - name: Verify design tokens and theme contrast
        run: pnpm tokens:check

      - name: Build library
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Build playground
        run: pnpm build:playground

      - name: Pack library
        run: pnpm run pack

      - name: Verify package contents
        run: |
          if tar -tf packages/ui-kit/whitelife-core-ui-kit-*.tgz | grep -E '(^|/)(node_modules|vue|primevue|primeicons)(/|$)'; then
            echo "Package must not contain bundled peer dependencies."
            exit 1
          fi

      - name: Verify packed package in consumer app
        run: pnpm verify:package

  browser:
    name: Browser regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Save theme screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiteui-browser-results
          path: apps/playground/test-results/
          if-no-files-found: ignore

  visual:
    name: Reviewed visual regression (desktop/mobile, three themes)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library CSS and public API
        run: pnpm build
      - name: Install pinned Chromium
        run: pnpm exec playwright install chromium
      - name: Compare reviewed screenshots
        run: pnpm test:visual
      - name: Save expected, actual, diff images and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiteui-visual-results
          path: apps/playground/test-results/
          if-no-files-found: ignore

  publish:
    needs: [verify, browser, visual]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@whitelife-core"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Publish to GitHub Packages
        run: pnpm --filter @whitelife-core/ui-kit publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
