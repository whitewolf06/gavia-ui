name: publish

# Gavia UI: checks on main/PR; public npm publication only from a new version tag.
# First npm publication and trusted-publisher setup: docs/releases.md.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playground imports the public package types; a fresh checkout has no dist.
      - name: Build library
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify dependency boundary
        run: pnpm verify:dependencies

      - name: Verify icon registry
        run: pnpm icons:check

      - name: Verify design tokens and theme contrast
        run: pnpm tokens:check

      - name: Test
        run: pnpm test

      - name: Build playground
        run: pnpm build:playground

      - name: Pack library
        id: package
        run: |
          pnpm run pack
          node -e "const p=require('./packages/ui-kit/package.json'); console.log('archive=gavia-ui-'+p.version+'.tgz')" >> "$GITHUB_OUTPUT"

      - name: Verify package contents
        run: |
          if tar -tf "packages/ui-kit/${{ steps.package.outputs.archive }}" | grep -E '(^|/)(node_modules|vue|primevue|primeicons)(/|$)'; then
            echo "Package must not contain bundled peer dependencies."
            exit 1
          fi

      - name: Verify packed package in consumer app
        run: pnpm verify:package --archive "packages/ui-kit/${{ steps.package.outputs.archive }}"

  browser:
    name: Browser regression tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: mobile-chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library CSS and public API
        run: pnpm build

      - name: Prefer Ubuntu archive for browser dependencies
        run: bash .github/scripts/prepare-browser-dependencies.sh

      - name: Install Playwright browsers
        timeout-minutes: 6
        run: pnpm exec playwright install --with-deps "${{ matrix.engine }}"

      - name: Run browser tests
        run: pnpm test:e2e --project="${{ matrix.project }}"

      - name: Save theme screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-browser-results-${{ matrix.project }}
          path: apps/playground/test-results/
          if-no-files-found: ignore

  visual:
    name: Reviewed visual regression (desktop/mobile, three themes)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library CSS and public API
        run: pnpm build
      - name: Install pinned Chromium
        run: pnpm exec playwright install chromium
      - name: Compare reviewed screenshots
        run: pnpm test:visual
      - name: Save expected, actual, diff images and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-visual-results
          path: apps/playground/test-results/
          if-no-files-found: ignore

  pages:
    name: Publish documentation to GitHub Pages
    needs: [verify, browser, visual]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'whitewolf06/gavia-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: gavia-ui-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library CSS and public API
        run: pnpm build
      - name: Build public documentation for its repository path
        run: pnpm build:pages
      - name: Prefer Ubuntu archive for browser dependencies
        run: bash .github/scripts/prepare-browser-dependencies.sh

      - name: Install pinned Chromium
        timeout-minutes: 6
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production Pages build
        run: pnpm test:pages
      - name: Save Pages smoke traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-pages-results
          path: apps/playground/test-results/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/playground/dist
      - name: Require the current main commit
        shell: bash
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$latest" = "$GITHUB_SHA"
      - uses: actions/deploy-pages@v5
        id: deployment

  publish:
    needs: [verify, browser, visual]
    # Bootstrap 0.7.0 is published manually; its new tag records history only.
    # See docs/releases.md for the first release and trusted-publisher setup.
    if: github.ref_type == 'tag' && github.repository == 'whitewolf06/gavia-ui' && github.ref_name != 'v0.7.0'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Check release tag
        run: node -e "const p=require('./packages/ui-kit/package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Tag and package version differ');"

      - name: Pack checked library
        id: package
        run: |
          pnpm run pack
          node -e "const fs=require('node:fs'), crypto=require('node:crypto'); const p=require('./packages/ui-kit/package.json'); const archive='gavia-ui-'+p.version+'.tgz'; const bytes=fs.readFileSync('packages/ui-kit/'+archive); console.log('archive='+archive); console.log('version='+p.version); console.log('integrity=sha512-'+crypto.createHash('sha512').update(bytes).digest('base64'));" >> "$GITHUB_OUTPUT"

      - name: Verify exact release archive in consumer app
        run: pnpm verify:package --archive "packages/ui-kit/${{ steps.package.outputs.archive }}"

      - name: Record checked release integrity
        run: echo "Checked release archive integrity ${{ steps.package.outputs.integrity }}"

      - name: Save checked release archive
        uses: actions/upload-artifact@v4
        with:
          name: gavia-ui-release-${{ steps.package.outputs.version }}
          path: packages/ui-kit/${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      # npm CLI is used only for OIDC publication, never for dependency installation.
      - name: Publish checked archive to public npm
        working-directory: packages/ui-kit
        run: npm publish "./${{ steps.package.outputs.archive }}" --access public --provenance
