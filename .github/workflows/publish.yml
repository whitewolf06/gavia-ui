name: publish

# Публикация @whitelife-core/ui-kit в GitHub Packages по тегу v*.
# Релизный цикл:
#   1. поднять version в packages/ui-kit/package.json и закоммитить
#   2. git tag v<version> && git push origin main --tags
#   3. Action соберёт, протестирует и опубликует пакет (приватно,
#      видимость наследуется от репозитория)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@whitelife-core"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build library
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Build playground
        run: pnpm build:playground

      - name: Pack library
        run: pnpm run pack

      - name: Verify package contents
        run: |
          if tar -tf packages/ui-kit/whitelife-core-ui-kit-*.tgz | grep -E '(^|/)(node_modules|vue|primevue)(/|$)'; then
            echo "Package must not contain bundled Vue or PrimeVue dependencies."
            exit 1
          fi

  publish:
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@whitelife-core"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Publish to GitHub Packages
        run: pnpm --filter @whitelife-core/ui-kit publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
