name: Supplemental Linux visuals
on:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Generate candidate Linux PNGs for review (never updates Windows baselines)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gavia-linux-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run official-container visual checks
        shell: bash
        env:
          UPDATE_BASELINES: ${{ inputs.update-snapshots }}
        run: |
          args=()
          if [ "$UPDATE_BASELINES" = true ]; then args+=(--update-snapshots); fi
          node scripts/visual-docker.mjs "${args[@]}"
      - name: Save Linux-only baseline candidates and diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gavia-ui-visual-linux
          path: |
            apps/playground/e2e/visual-baselines-linux/
            .tmp/visual-linux/
          include-hidden-files: true
          if-no-files-found: ignore
