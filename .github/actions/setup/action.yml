name: Gavia workspace
description: Set up the pinned package manager and supported Node runtime
inputs:
  node-version:
    description: Supported Node version
    default: '24'
  build:
    description: Build the library after installation
    default: 'false'
  registry-url:
    description: Optional npm registry for the publication job
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
        package-manager-cache: false
    - name: Install pinned dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build library
      if: inputs.build == 'true'
      shell: bash
      run: pnpm build
