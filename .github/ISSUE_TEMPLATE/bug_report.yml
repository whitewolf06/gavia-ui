name: Bug report
description: Report a reproducible problem in Gavia UI
title: "[Bug]: "
body:
  - type: input
    id: gavia
    attributes:
      label: Gavia UI version
      description: The exact installed version from your lockfile.
    validations:
      required: true
  - type: input
    id: vue
    attributes:
      label: Vue version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, version and operating system
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Gavia
        - Gavia Dark
        - Classic
        - Classic Dark
        - Newspaper
        - Custom
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction and steps
      description: Link a small example or include a Vue SFC and exact steps. Remove secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true

